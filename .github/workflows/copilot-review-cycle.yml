# ──────────────────────────────────────────────────────────────────────
# Copilot Review Cycle
#
# Automates the full Copilot review → fix → re-review loop so that
# pull requests converge to a clean review with zero human intervention.
#
# Flow:
#   1. Copilot reviewer submits a review (with inline comments)
#   2. This workflow collects the comments and asks the Copilot coding
#      agent (@copilot) to fix them
#   3. After the coding agent pushes fixes, a new Copilot review is
#      requested automatically
#   4. Steps 1-3 repeat until Copilot leaves zero inline comments or
#      the configurable MAX_ROUNDS limit is reached
#
# Triggers:
#   • pull_request_review  – when Copilot submits a review
#   • pull_request (sync)  – when new commits land during an active cycle
#   • workflow_dispatch     – manual kick-off for any open PR
# ──────────────────────────────────────────────────────────────────────

name: Copilot Review Cycle

on:
  pull_request_review:
    types: [submitted]

  pull_request:
    types: [synchronize]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to process'
        required: true
        type: number
      max_rounds:
        description: 'Maximum review-fix rounds (default: 10)'
        required: false
        type: number
        default: 10

# Only one cycle at a time per PR
concurrency:
  group: copilot-review-cycle-${{ github.event.pull_request.number || github.event.inputs.pr_number || '0' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # github.event.inputs is safe for all event types (evaluates to null
  # for non-dispatch triggers, falling back to the default of 10).
  MAX_ROUNDS: ${{ github.event.inputs.max_rounds || 10 }}
  COPILOT_REVIEWER: 'copilot-pull-request-reviewer[bot]'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1 — Process a Copilot review
  #
  # Runs when the Copilot pull-request reviewer submits a review or
  # when the workflow is triggered manually.
  # ─────────────────────────────────────────────────────────────────────
  handle-copilot-review:
    name: Process Copilot Review
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'copilot-pull-request-reviewer[bot]')

    steps:
      # ── Context ──
      - name: Determine PR number
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "review_id=${{ github.event.review.id }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Collect review comments ──
      - name: Fetch review comments
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          REPO="${{ github.repository }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Find the latest Copilot review for this PR
            REVIEW_ID=$(gh api "repos/${REPO}/pulls/${PR}/reviews" \
              --jq "[.[] | select(.user.login == \"${COPILOT_REVIEWER}\")] | last | .id // empty")
          else
            REVIEW_ID="${{ steps.ctx.outputs.review_id }}"
          fi

          if [ -z "$REVIEW_ID" ]; then
            echo "::warning::No Copilot review found on PR #${PR}"
            echo "comment_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "review_id=${REVIEW_ID}" >> "$GITHUB_OUTPUT"

          # Fetch inline review comments
          gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/comments" \
            --paginate > /tmp/review_comments.json

          COUNT=$(jq 'length' /tmp/review_comments.json)
          echo "comment_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "::notice::Copilot review #${REVIEW_ID} — ${COUNT} inline comment(s)"

      # ── Round tracking ──
      - name: Count review-cycle rounds
        id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          REPO="${{ github.repository }}"
          MAX="${{ env.MAX_ROUNDS }}"

          CURRENT=$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --paginate \
            --jq '[.[] | select(.body | test("<!-- copilot-review-cycle-round: \\d+ -->"))] | length')

          NEXT=$((CURRENT + 1))
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

          if [ "${NEXT}" -gt "${MAX}" ]; then
            echo "exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "exceeded=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice::Review cycle — round ${NEXT} of max ${MAX}"

      # ── No comments → cycle complete ──
      - name: Report clean review
        if: steps.review.outputs.comment_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          ROUNDS="${{ steps.rounds.outputs.current }}"

          gh pr comment "${PR}" --body "<!-- copilot-review-cycle-complete -->
          ## ✅ Copilot Review Cycle Complete

          Copilot review passed with **no inline comments** after **${ROUNDS}** review-fix round(s).

          The automated review cycle is finished — a human reviewer may now approve and merge this PR."

      # ── Max rounds reached ──
      - name: Report max rounds reached
        if: steps.review.outputs.comment_count != '0' && steps.rounds.outputs.exceeded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          MAX="${{ env.MAX_ROUNDS }}"

          gh pr comment "${PR}" --body "<!-- copilot-review-cycle-max-reached -->
          ## ⚠️ Copilot Review Cycle — Maximum Rounds Reached

          The automated cycle has reached its limit of **${MAX}** rounds but
          unresolved review comments remain.

          **Human intervention required.** Please:
          1. Review the remaining Copilot comments manually
          2. Fix or dismiss each comment
          3. Optionally re-run this workflow via \`workflow_dispatch\`"

      # ── Comments found → request Copilot coding agent to fix ──
      - name: Request Copilot fixes
        if: steps.review.outputs.comment_count != '0' && steps.rounds.outputs.exceeded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          ROUND="${{ steps.rounds.outputs.next }}"
          COUNT="${{ steps.review.outputs.comment_count }}"

          # ── Build the comment body in a temp file (avoids shell escaping) ──

          # Header
          cat > /tmp/cycle_comment.md <<EOF
          <!-- copilot-review-cycle-round: ${ROUND} -->
          ## 🔄 Copilot Review Cycle — Round ${ROUND}

          Copilot left **${COUNT}** inline comment(s) in its latest review.
          Requesting the Copilot coding agent to address them.

          ---
          EOF

          # Comment summary (from jq — safe for any content)
          jq -r '.[] |
            "### `\(.path):\(.line // .original_line // "?")`\n\(.body)\n"
          ' /tmp/review_comments.json >> /tmp/cycle_comment.md

          # Footer with @copilot fix instruction
          cat >> /tmp/cycle_comment.md <<'EOF'

          ---

          @copilot Please address **all** of the review comments listed above:
          1. Read each comment carefully
          2. Apply the suggested fix in the referenced file and line
          3. Commit all changes to this PR branch

          After your commits are pushed, a new Copilot review will be
          requested automatically by the review-cycle workflow.
          EOF

          # Post the comment
          gh pr comment "${PR}" --body-file /tmp/cycle_comment.md

          echo "::notice::Posted fix request — round ${ROUND}, ${COUNT} comment(s)"

  # ─────────────────────────────────────────────────────────────────────
  # Job 2 — Re-request Copilot review after new commits
  #
  # When new commits land on a PR branch during an active review cycle,
  # automatically request a fresh Copilot review so the cycle continues
  # without human intervention.
  # ─────────────────────────────────────────────────────────────────────
  re-request-review:
    name: Re-request Copilot Review
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize'

    steps:
      - name: Check whether review cycle is active
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Count round markers
          ROUNDS=$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --paginate \
            --jq '[.[] | select(.body | test("<!-- copilot-review-cycle-round: \\d+ -->"))] | length')

          # Count completion/max markers
          ENDED=$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --paginate \
            --jq '[.[] | select(.body | test("<!-- copilot-review-cycle-(complete|max-reached) -->"))] | length')

          if [ "${ROUNDS}" -gt 0 ] && [ "${ENDED}" -eq 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Review cycle is active (${ROUNDS} round(s) so far)"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No active review cycle — skipping"
          fi

      - name: Check for existing review on this commit
        if: steps.check.outputs.active == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          # Check if Copilot has already reviewed this exact commit
          EXISTS=$(gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq "[.[] | select(.user.login == \"${COPILOT_REVIEWER}\" and .commit_id == \"${HEAD_SHA}\")] | length")

          if [ "${EXISTS}" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Copilot already reviewed commit ${HEAD_SHA} — skipping re-request"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request new Copilot review
        if: steps.check.outputs.active == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"

          # Short delay so the CI workflow (ci.yml) has time to start first;
          # this avoids the Copilot review completing before CI even begins.
          sleep 5

          gh pr comment "${PR}" --body "<!-- copilot-review-cycle-re-review -->
          @copilot review

          _Automated re-review request from the Copilot Review Cycle workflow._"

          echo "::notice::Re-requested Copilot review for PR #${PR}"
