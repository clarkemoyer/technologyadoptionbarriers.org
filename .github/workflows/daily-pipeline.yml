name: Daily Pipeline (Analysis + Operations)

# Unified daily pipeline: analysis → approve → message → dashboard → report.
# Replaces the separate analysis-pipeline.yml (09:00) and
# daily-disposition-processing.yml (11:00) with a single chained workflow.
#
# All jobs are linked by `needs:` - each phase starts immediately when its
# dependencies finish. Total wall-clock time is ~10-15 min instead of 2+ hours.
#
# Data flow:
#   Phase 1: Prolific API → auth checks + submission statuses
#   Phase 2: Qualtrics API → raw CSV → enrich → disposition waterfall → analysis
#   Phase 3: Approve CLEAN on Prolific, message FLAGs, generate dashboard JSON
#   Phase 4: Commit all data (analysis JSON + dashboard JSON) to repo
#   Phase 5: Create daily report issue with deltas
#
# Safety: Approves CLEAN, sends review messages, auto-requests return for stale
# post-message PIDs, and auto-rejects stale post-request-return PIDs (both
# ceiling-guarded + kill-switch controlled).

on:
  schedule:
    - cron: '30 10 * * *' # Daily at 10:30 UTC (6:30am ET) - results ready by 7:00am ET
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Phase 1: Fetch Prolific data ─────────────────────────────
  # Auth check scores (HIGH/MIXED/LOW) and submission statuses keyed by
  # pseudonymous Prolific PIDs. No direct PII. 1-day artifact retention.
  fetch-prolific:
    name: 'Phase 1: Fetch Prolific Data'
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch auth checks and statuses
        run: python3 scripts/analysis/fetch_prolific_data.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          PROLIFIC_STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          AUTH_OUTPUT: ${{ runner.temp }}/auth-checks.csv
          STATUSES_OUTPUT: ${{ runner.temp }}/statuses.json

      - uses: actions/upload-artifact@v7
        with:
          name: prolific-data
          path: |
            ${{ runner.temp }}/auth-checks.csv
            ${{ runner.temp }}/statuses.json
          retention-days: 1

  # ── Phase 2: Export, Enrich, Analyze ─────────────────────────
  # All analysis + disposition triage in a single job. Raw CSV never
  # leaves the runner. Produces: analysis JSON, disposition CSV,
  # de-identified public dataset, analysis logs.
  analyze:
    name: 'Phase 2: Export, Enrich & Analyze'
    needs: fetch-prolific
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/analysis/requirements.txt
          pip install -r scripts/analysis/requirements-validation.txt

      - name: Export Qualtrics CSV
        run: python3 scripts/analysis/export_qualtrics.py
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          OUTPUT_PATH: ${{ runner.temp }}/qualtrics-raw.csv

      - uses: actions/download-artifact@v8
        with:
          name: prolific-data
          path: ${{ runner.temp }}

      - name: Enrich CSV with Prolific data
        run: |
          python scripts/analysis/enrich_qualtrics_csv.py \
            --qualtrics "${{ runner.temp }}/qualtrics-raw.csv" \
            --auth-checks "${{ runner.temp }}/auth-checks.csv" \
            --statuses "${{ runner.temp }}/statuses.json" \
            --output "${{ runner.temp }}/qualtrics-enriched.csv"

      # Disposition waterfall + disposition CSV for operations phase
      - name: Data audit (disposition waterfall)
        run: |
          python scripts/analysis/tabs_v2_data_audit.py \
            --input "${{ runner.temp }}/qualtrics-enriched.csv" \
            --output "${{ runner.temp }}/data-audit.json" \
            --disposition-csv "${{ runner.temp }}/disposition.csv"

      - name: De-identify dataset
        run: |
          python scripts/deidentify_tabs_data.py \
            "${{ runner.temp }}/qualtrics-enriched.csv" \
            "${{ runner.temp }}/deidentified" \
            --skip-review

      # ── CRP Dataset (N=200) ──
      # Produces the frozen public dataset for the Culminating Research Project.
      # Once the canonical CSV exists in the repo, the CRP build is skipped
      # to preserve the moment-in-time snapshot used for the CRP submission.
      # To regenerate, delete public/datasets/TABS_V2_CRP_2026_public_dataset.csv
      # from the repo and re-run the pipeline.
      # FAIL-FAST (PR #1695): no continue-on-error. If the CRP dataset
      # build is needed (no existing snapshot) and it fails, the whole
      # workflow must fail so no new JSON reaches src/data/ from a
      # partially-populated pipeline run. The step's own early-exits
      # cover the expected skip cases (CSV already frozen).
      - name: Build CRP dataset (N=200)
        id: crp
        run: |
          CRP_CSV="public/datasets/TABS_V2_CRP_2026_public_dataset.csv"
          PIPELINE_BRANCH="chore/daily-pipeline-data"

          # Check 1: already in current checkout
          if [ -f "$CRP_CSV" ]; then
            echo "CRP dataset already exists in checkout - skipping to preserve frozen snapshot"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 2: already on origin/main (covers workflow_dispatch from non-main branch)
          git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main" 2>/dev/null || true
          if git show "origin/main:$CRP_CSV" >/dev/null 2>&1; then
            echo "CRP dataset already exists on origin/main - skipping to preserve frozen snapshot"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 3: already on pending daily-pipeline PR branch (not yet merged)
          git fetch --no-tags --depth=1 origin "$PIPELINE_BRANCH:refs/remotes/origin/$PIPELINE_BRANCH" 2>/dev/null || true
          if git show "origin/$PIPELINE_BRANCH:$CRP_CSV" >/dev/null 2>&1; then
            echo "CRP dataset already exists on origin/$PIPELINE_BRANCH - skipping to preserve frozen snapshot"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set -euo pipefail
          python scripts/analysis/create_crp_dataset.py \
            "${{ runner.temp }}/qualtrics-enriched.csv" \
            --target-n 200 \
            --output-dir "${{ runner.temp }}/crp-output" \
            --skip-review
          echo "produced=true" >> "$GITHUB_OUTPUT"

      # FAIL-FAST (PR #1695): no continue-on-error. If CRP filtering
      # fails mid-run, the workflow must stop rather than proceed to
      # commit on stale/mismatched row counts.
      - name: Build CRP-only enriched CSV for analysis
        id: crp_filter
        if: steps.crp.outputs.produced == 'true'
        run: |
          python3 - <<'PY'
          import csv, pathlib, sys

          tmp = pathlib.Path("${{ runner.temp }}")
          mapping = tmp / "crp-output" / "responseid_mapping_CONFIDENTIAL.csv"
          enriched = tmp / "qualtrics-enriched.csv"
          output = tmp / "qualtrics-enriched-crp-sample.csv"

          selected_ids = set()
          with mapping.open(newline="", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  selected_ids.add(row["original_response_id"])
          print(f"  Selected ResponseIds from mapping: {len(selected_ids)}")

          with enriched.open(newline="", encoding="utf-8-sig") as f:
              all_rows = list(csv.reader(f))
          headers = all_rows[:3]
          rid_idx = all_rows[0].index("ResponseId")
          data = [r for r in all_rows[3:] if len(r) > rid_idx and r[rid_idx] in selected_ids]
          print(f"  Filtered rows: {len(data)} (expected {len(selected_ids)})")

          if len(data) != len(selected_ids):
              print(f"  ERROR: Row count mismatch - expected {len(selected_ids)}, got {len(data)}", file=sys.stderr)
              sys.exit(1)

          with output.open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerows(headers)
              w.writerows(data)
          PY

      - name: Stage CRP public CSV
        if: steps.crp.outputs.produced == 'true'
        run: |
          if [ -f "${{ runner.temp }}/crp-output/TABS_V2_CRP_public_dataset.csv" ]; then
            mkdir -p "${{ runner.temp }}/crp-public"
            cp "${{ runner.temp }}/crp-output/TABS_V2_CRP_public_dataset.csv" \
               "${{ runner.temp }}/crp-public/TABS_V2_CRP_2026_public_dataset.csv"
          else
            echo "CRP public CSV not found - skipping"
          fi

      # ── Unified Analysis: LIVE dataset ─────────────────────────
      # Single script replaces tabs_v2_analysis.py + advanced.py +
      # quality_audit.py + psychometrics.py + validation.py
      - name: Unified analysis (LIVE dataset)
        run: |
          set -euo pipefail
          python scripts/analysis/tabs_v2_unified_data_analysis.py \
            "${{ runner.temp }}/qualtrics-enriched.csv" \
            --json "${{ runner.temp }}/live-unified.json"
          # Extract backward-compatible JSONs for page imports.
          # FAIL-FAST (PR #1695): hard dict lookups, not .get() defaults.
          # If 'sensitivity' or 'validation' is missing from the unified
          # JSON - or is None or {} - the explicit presence/emptiness
          # guard below calls sys.exit(1) with a ::error:: annotation
          # BEFORE any d[key] lookup runs, so the step fails with an
          # actionable message rather than a raw KeyError. set -euo
          # pipefail then fails the whole job, and the commit step is
          # gated off by needs:[analyze], so no empty {} ever reaches
          # src/data/sensitivity-analysis.json.
          # Do NOT change these to d.get(key, {}) - that re-introduces
          # the silent-default policy that PR #1695 explicitly removes.
          python3 << 'PYEOF'
          import json, sys
          with open('${{ runner.temp }}/live-unified.json') as f:
              d = json.load(f)
          for required_key in ('sensitivity', 'validation'):
              if required_key not in d:
                  print(f'::error::live-unified.json missing required key: {required_key}', file=sys.stderr)
                  sys.exit(1)
              if d[required_key] is None or d[required_key] == {}:
                  print(f'::error::live-unified.json has empty/null {required_key} block', file=sys.stderr)
                  sys.exit(1)
          with open('${{ runner.temp }}/sensitivity-analysis.json', 'w') as f:
              json.dump(d['sensitivity'], f, indent=2)
          with open('${{ runner.temp }}/live-validation.json', 'w') as f:
              json.dump(d['validation'], f, indent=2)
          print('Extracted: sensitivity-analysis.json, live-validation.json')
          PYEOF

      # ── Unified Analysis: CRP frozen dataset ──────────────────
      # Runs EVERY DAY against the frozen CSV in the repo, NOT gated
      # on CSV creation. This ensures code changes (bug fixes, new
      # stats) are reflected in CRP pages without touching the data.
      #
      # The CRP public CSV is de-identified and lacks Auth_LLM/Auth_Bots
      # columns needed for conservative_clean filtering. We re-attach
      # these quality flags by joining on SESSION_ID from the daily
      # enriched Qualtrics CSV (which has Prolific auth data).
      - name: Enrich CRP CSV with auth flags (via SESSION_ID join)
        id: crp_enrich
        run: |
          set -euo pipefail
          CRP_CSV="public/datasets/TABS_V2_CRP_2026_public_dataset.csv"
          ENRICHED_CSV="${{ runner.temp }}/qualtrics-enriched.csv"
          OUTPUT="${{ runner.temp }}/crp-enriched-for-analysis.csv"
          if [ ! -f "$CRP_CSV" ]; then
            echo "::error::CRP public CSV not found at $CRP_CSV"
            exit 1
          fi
          if [ ! -f "$ENRICHED_CSV" ]; then
            echo "::error::Enriched Qualtrics CSV not found - cannot join auth flags"
            exit 1
          fi
          python3 - <<PY
          import csv
          import sys

          # Load auth flags from enriched CSV, keyed by SESSION_ID
          auth_by_session = {}
          with open('$ENRICHED_CSV', encoding='utf-8-sig') as f:
              reader = csv.reader(f)
              eh = next(reader); next(reader); next(reader)  # 3-row Qualtrics header
              eidx = {h: i for i, h in enumerate(eh)}
              required_cols = ['SESSION_ID', 'Auth_LLM', 'Auth_Bots']
              missing_cols = [c for c in required_cols if c not in eidx]
              if missing_cols:
                  print(f'ERROR: enriched CSV missing required columns: {", ".join(missing_cols)}', file=sys.stderr)
                  sys.exit(1)
              sid_col = eidx['SESSION_ID']
              llm_col = eidx['Auth_LLM']
              bots_col = eidx['Auth_Bots']
              recap_col = eidx.get('Q_RecaptchaScore')
              sl_col = eidx.get('Q_StraightliningCount')
              for r in reader:
                  sid = r[sid_col].strip()
                  if sid:
                      auth_by_session[sid] = {
                          'Auth_Flagged': 'True' if (
                              r[llm_col].strip().upper() in ('LOW', 'MIXED') or
                              r[bots_col].strip().upper() in ('LOW', 'MIXED')
                          ) else 'False',
                          'RecaptchaPass': 'True',
                          'StraightliningCount': '0',
                      }
                      if recap_col is not None:
                          try:
                              score = float(r[recap_col].strip() or '1.0')
                              auth_by_session[sid]['RecaptchaPass'] = 'True' if score >= 0.5 else 'False'
                          except ValueError:
                              pass
                      if sl_col is not None:
                          auth_by_session[sid]['StraightliningCount'] = r[sl_col].strip() or '0'

          print(f'  Auth flags loaded for {len(auth_by_session)} sessions')

          # Read CRP CSV and append derived columns
          with open('$CRP_CSV', encoding='utf-8-sig') as f:
              reader = csv.reader(f)
              crp_headers = next(reader)
              crp_rows = list(reader)
          crp_idx = {h: i for i, h in enumerate(crp_headers)}
          crp_sid_col = crp_idx.get('SESSION_ID')
          if crp_sid_col is None:
              print('ERROR: SESSION_ID column not found in CRP CSV', file=sys.stderr)
              sys.exit(1)

          new_cols = ['Auth_Flagged', 'RecaptchaPass', 'StraightliningCount']
          existing_auth = [c for c in new_cols if c in crp_idx]
          cols_to_add = [c for c in new_cols if c not in crp_idx]
          # Build output headers: keep existing, append only missing auth columns
          out_headers = crp_headers + cols_to_add
          # Map existing auth col names to their row index (only cols already present)
          auth_col_idxs = {c: crp_idx[c] for c in existing_auth}
          if existing_auth:
              print(f'  Auth columns already in CRP CSV; overwriting in-place: {existing_auth}')
          if cols_to_add:
              print(f'  Appending new auth columns: {cols_to_add}')
          out_rows = []
          matched = 0
          unmatched_sids = []
          for r in crp_rows:
              sid = r[crp_sid_col].strip()
              auth = auth_by_session.get(sid)
              if auth is None:
                  unmatched_sids.append(sid)
              else:
                  matched += 1
                  for col, col_idx in auth_col_idxs.items():
                      r[col_idx] = auth[col]
                  r.extend([auth[c] for c in cols_to_add])
                  out_rows.append(r)

          print(f'  Matched {matched}/{len(crp_rows)} CRP rows to enriched auth data')
          if unmatched_sids:
              print(f'  ERROR: {len(unmatched_sids)} CRP SESSION_IDs not found in enriched CSV', file=sys.stderr)
              preview = unmatched_sids[:10]
              print(f'  Unmatched SESSION_ID sample (up to 10): {", ".join(preview)}', file=sys.stderr)
              print('  Refusing to continue: missing auth enrichment would change conservative_clean results.', file=sys.stderr)
              sys.exit(1)

          with open('$OUTPUT', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(out_headers)
              w.writerows(out_rows)
          print(f'  Wrote enriched CRP CSV: $OUTPUT')
          PY

      - name: Unified analysis (CRP frozen N=200)
        id: crp_unified
        run: |
          set -euo pipefail
          CRP_CSV="${{ runner.temp }}/crp-enriched-for-analysis.csv"
          if [ ! -f "$CRP_CSV" ]; then
            echo "::error::Enriched CRP CSV not found - CRP enrichment step must have failed"
            exit 1
          fi
          python scripts/analysis/tabs_v2_unified_data_analysis.py \
            "$CRP_CSV" \
            --crp200 \
            --json "${{ runner.temp }}/crp-unified.json"
          # Extract backward-compatible JSONs for page imports.
          # FAIL-FAST (PR #1695): hard dict lookups, not .get() defaults.
          # Identical policy to the live-unified extractor above - see
          # that block's header comment for rationale. Do NOT change
          # these to d.get(key, {}).
          python3 << 'PYEOF'
          import json, sys
          with open('${{ runner.temp }}/crp-unified.json') as f:
              d = json.load(f)
          for required_key in ('sensitivity', 'validation'):
              if required_key not in d:
                  print(f'::error::crp-unified.json missing required key: {required_key}', file=sys.stderr)
                  sys.exit(1)
              if d[required_key] is None or d[required_key] == {}:
                  print(f'::error::crp-unified.json has empty/null {required_key} block', file=sys.stderr)
                  sys.exit(1)
          with open('${{ runner.temp }}/crp-sensitivity-analysis.json', 'w') as f:
              json.dump(d['sensitivity'], f, indent=2)
          with open('${{ runner.temp }}/crp-validation.json', 'w') as f:
              json.dump(d['validation'], f, indent=2)
          print('Extracted: crp-sensitivity-analysis.json, crp-validation.json')
          PYEOF

      - name: Generate summary
        if: always()
        run: |
          echo "### Analysis Pipeline Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${{ runner.temp }}/sensitivity-analysis.json" ]; then
            python3 scripts/analysis/tests/generate_summary.py "${{ runner.temp }}/sensitivity-analysis.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "${{ runner.temp }}/data-audit.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Disposition Waterfall" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/analysis/tests/generate_summary.py "${{ runner.temp }}/data-audit.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Artifacts ──────────────────────────────────────────────
      # Only upload extracted JSONs that are safe for src/data/ commit.
      # Full unified JSON is uploaded separately as internal-only artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-results
          path: |
            ${{ runner.temp }}/sensitivity-analysis.json
            ${{ runner.temp }}/data-audit.json
            ${{ runner.temp }}/live-validation.json
          retention-days: 7
          if-no-files-found: warn

      # Full unified JSON - internal only, never committed to repo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unified-analysis-internal
          path: ${{ runner.temp }}/live-unified.json
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disposition-csv
          path: ${{ runner.temp }}/disposition.csv
          retention-days: 1
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-dataset
          path: ${{ runner.temp }}/deidentified/TABS_V2_public_dataset.csv
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: steps.crp.outputs.produced == 'true'
        with:
          name: crp-dataset
          path: ${{ runner.temp }}/crp-public/TABS_V2_CRP_2026_public_dataset.csv
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: crp-analysis-results
          path: |
            ${{ runner.temp }}/crp-unified.json
            ${{ runner.temp }}/crp-sensitivity-analysis.json
            ${{ runner.temp }}/crp-validation.json
          retention-days: 7
          if-no-files-found: error

  # ── Phase 3a: Auto-approve CLEAN ─────────────────────────────
  approve-clean:
    name: 'Phase 3: Auto-Approve CLEAN'
    needs: analyze
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}

      - name: Approve CLEAN submissions
        run: |
          set -euo pipefail
          python3 scripts/analysis/approve_submissions.py 2>&1 | tee ${{ runner.temp }}/approve-output.txt
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          DRY_RUN: 'false'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approve-metrics
          path: ${{ runner.temp }}/approve-output.txt
          retention-days: 1

  # ── Phase 3b: Message FLAG participants (parallel with 3a) ───
  message-flags:
    name: 'Phase 3: Message FLAGs'
    needs: analyze
    runs-on: ubuntu-latest
    environment: prolific-prod
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        disposition:
          - FLAG-SINGLE-IRI
          - FLAG-SMEAL
          - FLAG-PARTIAL-STRAIGHTLINING
          - FLAG-SPEED
          - FLAG-RECAPTCHA
          - AUTO-EXCLUDE:IRI3_SPEED_RETURN
          - AUTO-EXCLUDE:IRI3_RETURN
          - AUTO-EXCLUDE:IRI2_SPEED_RETURN
          - AUTO-EXCLUDE:IRI2_RETURN
          - AUTO-EXCLUDE:SPEED_IRI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}

      - name: Send messages for ${{ matrix.disposition }}
        run: |
          set -euo pipefail
          python3 scripts/analysis/message_flagged.py 2>&1 | tee ${{ runner.temp }}/message-output.txt
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          DISPOSITION_FILTER: ${{ matrix.disposition }}
          DRY_RUN: 'false'

      - name: Sanitize artifact name
        if: always()
        run: echo "ARTIFACT_NAME=message-metrics-${DISPOSITION_FILTER//:/-}" >> "$GITHUB_ENV"
        env:
          DISPOSITION_FILTER: ${{ matrix.disposition }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/message-output.txt
          retention-days: 1

  # ── Phase 3c: Generate dashboard (after approve, parallel with messages) ─
  generate-dashboard:
    name: 'Phase 3: Generate Dashboard'
    needs: [analyze, approve-clean]
    # Run if analyze succeeded, even if approve-clean failed (Prolific API glitch
    # should not prevent dashboard generation or analysis commit)
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}

      - name: Generate disposition summary
        run: python3 scripts/analysis/generate_disposition_summary.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          OUTPUT_PATH: ${{ runner.temp }}/disposition-summary.json

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-data
          path: ${{ runner.temp }}/disposition-summary.json
          retention-days: 1

      - name: Find stale AWAITING REVIEW submissions
        # Outputs two buckets used by the daily report:
        # - stale no reply to return request (reject candidates)
        # - stale no reply to TABS message  (request-return candidates)
        run: python3 scripts/analysis/find_stale_return_requested.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          # Reject (return-request -> reject) window: kept at the full 48h so
          # participants always have 48h after a formal return request.
          STALE_HOURS: '48'
          # Request-return (message -> request-return) window: shorter so the
          # formal request-return fires sooner. Tunable via repo variable
          # REQUEST_RETURN_STALE_HOURS (default 24); set it to 48 to restore the
          # original single-window cadence.
          MESSAGE_STALE_HOURS: ${{ vars.REQUEST_RETURN_STALE_HOURS || '24' }}
          OUTPUT_JSON_PATH: ${{ runner.temp }}/stale-triage.json

      - uses: actions/upload-artifact@v7
        with:
          name: stale-triage
          path: ${{ runner.temp }}/stale-triage.json
          retention-days: 1

  # ── Phase 3d: Auto-dispatch API request-return for stale-after-message PIDs ─
  # Reads stale-triage.json's `stale_no_reply_to_message` bucket (TABS messaged
  # > MESSAGE_STALE_HOURS ago — default 24h via REQUEST_RETURN_STALE_HOURS — no
  # participant reply, no API-level return request yet) and runs
  # request_return_by_pid.py to dispatch /submissions/{id}/request-return/ per
  # PID. Disposition-aware reason text per PID. Ceiling-guarded.
  #
  # Kill switch: vars.AUTO_REQUEST_RETURN_ENABLED (default 'true').
  # Ceiling:     vars.AUTO_STALE_MAX_PER_RUN     (default '30').
  auto-request-return:
    name: 'Phase 3d: Auto-Request-Return'
    needs: [analyze, generate-dashboard]
    if: ${{ needs.generate-dashboard.result == 'success' && vars.AUTO_REQUEST_RETURN_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: stale-triage
          path: ${{ runner.temp }}

      - name: Extract stale_no_reply_to_message PIDs
        id: pids
        run: |
          set -euo pipefail
          PID_LIST=$(python3 -c "
          import json
          with open('${{ runner.temp }}/stale-triage.json', encoding='utf-8') as f:
              d = json.load(f)
          pids = [r['pid'] for r in d.get('buckets', {}).get('stale_no_reply_to_message', []) if r.get('pid')]
          print(','.join(pids))
          ")
          COUNT=$(python3 -c "print(len('$PID_LIST'.split(',')) if '$PID_LIST' else 0)")
          echo "pid_list=$PID_LIST" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT PIDs in stale_no_reply_to_message bucket"

      - name: Auto request-return
        if: ${{ steps.pids.outputs.count != '0' }}
        run: python3 scripts/analysis/request_return_by_pid.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          PID_LIST: ${{ steps.pids.outputs.pid_list }}
          MAX_PER_RUN: ${{ vars.AUTO_STALE_MAX_PER_RUN || '30' }}
          # Revalidation windows MUST match the stale-triage step above so a PID
          # selected at the shorter message window is not re-skipped here.
          STALE_HOURS: '48'
          MESSAGE_STALE_HOURS: ${{ vars.REQUEST_RETURN_STALE_HOURS || '24' }}
          DRY_RUN: 'false'
          CONFIRM_REQUEST_RETURN: 'REQUEST_RETURN'
          OUTPUT_JSON_PATH: ${{ runner.temp }}/auto-request-return-results.json

      - name: Write empty results JSON when no PIDs
        if: ${{ steps.pids.outputs.count == '0' }}
        run: |
          cat > "${{ runner.temp }}/auto-request-return-results.json" <<EOF
          {"mode": "no_action", "input_count": 0, "successes": [], "failures": [], "skipped_non_awaiting": [], "ceiling_exceeded": false}
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auto-request-return-results
          path: ${{ runner.temp }}/auto-request-return-results.json
          retention-days: 7

  # ── Phase 3e: Auto-reject stale-no-reply-to-return-request ───────────────
  # Reads stale-triage.json's `stale_no_reply_to_rr` bucket (formal API
  # request-return sent > 48h ago, no participant reply since). Prolific
  # auto-APPROVES these after the reserve timeout, so they MUST be rejected
  # before that window closes. Ceiling-guarded.
  #
  # Kill switch: vars.AUTO_REJECT_STALE_ENABLED (default 'true').
  # Ceiling:     vars.AUTO_STALE_MAX_PER_RUN   (default '30').
  auto-reject-stale:
    name: 'Phase 3e: Auto-Reject-Stale-RR'
    needs: [analyze, generate-dashboard, auto-request-return]
    if: ${{ always() && needs.generate-dashboard.result == 'success' && vars.AUTO_REJECT_STALE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: stale-triage
          path: ${{ runner.temp }}

      - name: Extract stale_no_reply_to_rr PIDs
        id: pids
        run: |
          set -euo pipefail
          PID_LIST=$(python3 -c "
          import json
          with open('${{ runner.temp }}/stale-triage.json', encoding='utf-8') as f:
              d = json.load(f)
          pids = [r['pid'] for r in d.get('buckets', {}).get('stale_no_reply_to_rr', []) if r.get('pid')]
          print(','.join(pids))
          ")
          COUNT=$(python3 -c "print(len('$PID_LIST'.split(',')) if '$PID_LIST' else 0)")
          echo "pid_list=$PID_LIST" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT PIDs in stale_no_reply_to_rr bucket"

      - name: Auto reject
        if: ${{ steps.pids.outputs.count != '0' }}
        run: python3 scripts/analysis/reject_by_pid.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          PID_LIST: ${{ steps.pids.outputs.pid_list }}
          MAX_PER_RUN: ${{ vars.AUTO_STALE_MAX_PER_RUN || '30' }}
          STRICT_AWAITING: 'false'
          DRY_RUN: 'false'
          CONFIRM_REJECT: 'REJECT'
          OUTPUT_JSON_PATH: ${{ runner.temp }}/auto-reject-stale-results.json

      - name: Write empty results JSON when no PIDs
        if: ${{ steps.pids.outputs.count == '0' }}
        run: |
          cat > "${{ runner.temp }}/auto-reject-stale-results.json" <<EOF
          {"mode": "no_action", "input_count": 0, "successes": [], "failures": [], "skipped_non_awaiting": [], "ceiling_exceeded": false}
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auto-reject-stale-results
          path: ${{ runner.temp }}/auto-reject-stale-results.json
          retention-days: 7

  # ── Phase 3f: Export Prolific messages (inbound replies) ─────
  # Pulls every Prolific message in the TABS V2 study channel and writes
  # an aggregate summary plus an inbound-participant CSV. Phase 5 reads
  # the inbound CSV to compute the "Replies to Consider" report section
  # (count of AWAITING REVIEW PIDs that have replied to TABS messages).
  # PII-bearing CSV is 1-day artifact retention to match the disposition
  # CSV privacy treatment. Aggregate summary is committable (7-day).
  # Runs in parallel with other Phase 3 jobs; gates only on Phase 2.
  export-messages:
    name: 'Phase 3f: Export Prolific Messages'
    needs: analyze
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Extract Prolific messages
        run: python3 scripts/analysis/extract_prolific_messages.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          SINCE: '2025-01-01T00:00:00Z'
          RAW_OUTPUT_PATH: ${{ runner.temp }}/all_messages_raw.json
          INBOUND_CSV_PATH: ${{ runner.temp }}/participant_messages.csv
          TRANSCRIPTS_PATH: ${{ runner.temp }}/participant_messages.md
          CANDIDATES_PATH: ${{ runner.temp }}/candidates_to_review.md
          SUMMARY_PATH: ${{ runner.temp }}/aggregate-summary.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Keep singular name to match prolific-message-export.yml.
          name: prolific-message-aggregate-summary
          path: ${{ runner.temp }}/aggregate-summary.json
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prolific-messages-inbound-csv
          path: ${{ runner.temp }}/participant_messages.csv
          retention-days: 1
          if-no-files-found: warn

  # ── Phase 4: Commit all data (single PR) ─────────────────────
  commit-results:
    name: 'Phase 4: Commit All Data'
    needs: [analyze, generate-dashboard]
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - uses: actions/checkout@v7

      # Download analysis results and dashboard data into src/data
      - uses: actions/download-artifact@v8
        with:
          name: analysis-results
          path: src/data

      - uses: actions/download-artifact@v8
        with:
          name: dashboard-data
          path: src/data

      # Download CRP artifacts
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: crp-dataset
          path: ${{ runner.temp }}/crp-csv

      - uses: actions/download-artifact@v8
        with:
          name: crp-analysis-results
          path: ${{ runner.temp }}/crp-json

      - name: Stage CRP files into repo
        run: |
          set -euo pipefail
          # CRP public CSV - only staged on first build (produced=true)
          if [ -f "${{ runner.temp }}/crp-csv/TABS_V2_CRP_2026_public_dataset.csv" ]; then
            mkdir -p public/datasets
            cp "${{ runner.temp }}/crp-csv/TABS_V2_CRP_2026_public_dataset.csv" \
               public/datasets/TABS_V2_CRP_2026_public_dataset.csv
            echo "  Staged: public/datasets/TABS_V2_CRP_2026_public_dataset.csv"
          fi

          # CRP analysis JSONs - MUST exist, produced daily
          if [ ! -f "${{ runner.temp }}/crp-json/crp-sensitivity-analysis.json" ]; then
            echo "::error::crp-sensitivity-analysis.json missing from CRP analysis results"
            exit 1
          fi
          cp "${{ runner.temp }}/crp-json/crp-sensitivity-analysis.json" \
             src/data/crp-sensitivity-analysis.json
          echo "  Staged: src/data/crp-sensitivity-analysis.json"

          if [ ! -f "${{ runner.temp }}/crp-json/crp-validation.json" ]; then
            echo "::error::crp-validation.json missing from CRP analysis results"
            exit 1
          fi
          cp "${{ runner.temp }}/crp-json/crp-validation.json" \
             src/data/crp-validation.json
          echo "  Staged: src/data/crp-validation.json"

      - name: Compute files to format
        id: format_files
        run: |
          FILES="src/data/sensitivity-analysis.json src/data/data-audit.json src/data/disposition-summary.json src/data/live-validation.json"
          if [ -f "src/data/crp-sensitivity-analysis.json" ]; then
            FILES="$FILES src/data/crp-sensitivity-analysis.json"
          fi
          if [ -f "src/data/crp-validation.json" ]; then
            FILES="$FILES src/data/crp-validation.json"
          fi
          echo "list=$FILES" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/format-and-pr
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          files: ${{ steps.format_files.outputs.list }}
          commit-message: 'chore: update daily pipeline data (analysis + dashboard + CRP)'
          pr-title: 'Update daily pipeline data'
          pr-body: |
            Automated update from the unified daily pipeline.

            **Data flow**: Qualtrics export → Prolific enrichment →
            disposition waterfall → analysis suite → CRP dataset (N=200) →
            approve CLEAN → dashboard summary.

            All statistics computed across 5 sample definitions.
            CRP dataset: N=200 tiered selection + NIST de-identification.
          branch: chore/daily-pipeline-data

  # ── Phase 5: Daily report issue ──────────────────────────────
  daily-report:
    name: 'Phase 5: Daily Report'
    needs:
      [
        analyze,
        approve-clean,
        message-flags,
        generate-dashboard,
        auto-request-return,
        auto-reject-stale,
        export-messages,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
        continue-on-error: true

      # Build the reply-action recommendations JSON before the report runs.
      # Phase 5 checks out ref:main for safety; this script lands on main only
      # after PR #2638 + #2692 are merged. The file-existence guard handles
      # the rollout window where one PR has merged but the other has not.
      # Once both PRs are on main the guard is a no-op but stays as a safety
      # check against accidental script deletion.
      # Renders nothing in the report when Phase 3f's inbound CSV is missing.
      - name: Classify replies for action
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f scripts/analysis/classify_replies_for_action.py ]; then
            echo "::warning::classify_replies_for_action.py not present on main; skipping recommendations step (likely mid-rollout of PR #2638)"
            exit 0
          fi
          python3 scripts/analysis/classify_replies_for_action.py
        env:
          INBOUND_CSV: ${{ runner.temp }}/artifacts/prolific-messages-inbound-csv/participant_messages.csv
          DISPOSITION_CSV: ${{ runner.temp }}/artifacts/disposition-csv/disposition.csv
          OUTPUT_JSON_PATH: ${{ runner.temp }}/reply-action-recommendations.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reply-action-recommendations
          path: ${{ runner.temp }}/reply-action-recommendations.json
          # 1-day retention: this JSON contains full participant IDs from
          # the AWAITING REVIEW queue, so it matches the privacy treatment
          # of disposition-csv and other PID-bearing intermediate artifacts.
          # The bulk-approve/bulk-reject dispatch workflows must run within
          # 24h of the source daily-pipeline run.
          retention-days: 1
          if-no-files-found: warn

      - name: Build and create daily report issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          RECOMMENDATIONS_JSON: ${{ runner.temp }}/reply-action-recommendations.json
          PREV_FILE: src/data/disposition-summary.json
          TRIAGE_RESULT: ${{ needs.analyze.result }}
          APPROVE_RESULT_STATUS: ${{ needs.approve-clean.result }}
          MESSAGE_RESULT: ${{ needs.message-flags.result }}
          DASHBOARD_RESULT: ${{ needs.generate-dashboard.result }}
          AUTO_REQUEST_RETURN_RESULT: ${{ needs.auto-request-return.result }}
          AUTO_REJECT_STALE_RESULT: ${{ needs.auto-reject-stale.result }}
          EXPORT_MESSAGES_RESULT: ${{ needs.export-messages.result }}
        run: bash scripts/build-daily-report.sh
