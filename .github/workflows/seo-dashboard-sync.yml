name: Daily SEO Dashboard Sync

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-timestamp:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update SEO Dashboard Metrics and Time Series
        id: sync_script
        run: npx tsx scripts/update-seo-dashboard-sync.ts
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GSC_SITE_URL: 'sc-domain:technologyadoptionbarriers.org'

      - name: Trigger SEO Regression Alert
        if: steps.sync_script.outputs.REGRESSION_DETECTED == 'true'
        run: |
          gh issue create \
            --title "🚨 CRITICAL: SEO Regression Detected (-${{ steps.sync_script.outputs.IMPRESSIONS_DROP }}% Impressions)" \
            --body "The automated SEO dashboard sync script detected a massive drop in trailing 28-day organic impressions versus the previous baseline.\\n\\n**Drop Percentage:** \`-${{ steps.sync_script.outputs.IMPRESSIONS_DROP }}%\`\\n\\n*Please check Google Search Console coverage index immediately or review recent static export build logs.*" \
            --label "bug" \
            --label "high-priority"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}

      - name: Format updated SEO data files
        run: npx prettier --write "src/data/seo-*.json"

      - name: Create pull request with updated sync time
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          commit-message: 'chore: execute automated SEO dashboard daily sync'
          title: 'Update SEO Transparency Dashboard Sync'
          body: |
            Automated execution of `scripts/update-seo-dashboard-sync.ts`.

            This PR updates the SEO Time Series chart data, dashboard metrics, and top keywords list by contacting the GA4 and GSC APIs. It will also flag any organic traffic regressions automatically.
          branch: chore/seo-dashboard-daily-sync
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
