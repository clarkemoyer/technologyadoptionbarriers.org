name: Check Participant Details

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: single (one PID) or all-replies (all participants who replied)'
        required: true
        type: choice
        options:
          - single
          - all-replies
          - send-thank-you
          - unreject
          - send-custom
          - awaiting-report
          - request-return
          - stale-return-requested
          - search-messages
          - find-url-replies
          - demographics
        default: 'single'
      pid:
        description: 'Prolific Participant ID (required for single/send-custom mode)'
        required: false
        type: string
      message:
        description: 'Custom message body (required for send-custom mode)'
        required: false
        type: string
      study_id:
        description: 'Study ID (defaults to PROLIFIC_STUDY_ID)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check Participant
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Node.js only needed for modes that still run TS (single, search-messages, request-return, awaiting-report, verify-iri)
      - uses: actions/setup-node@v6
        if: ${{ !contains(fromJSON('["demographics","find-url-replies","all-replies","send-custom","unreject","send-thank-you"]'), inputs.mode) }}
        with:
          node-version: '20'
          cache: 'npm'
      - if: ${{ !contains(fromJSON('["demographics","find-url-replies","all-replies","send-custom","unreject","send-thank-you"]'), inputs.mode) }}
        run: npm ci

      - name: Fetch Prolific demographics
        if: inputs.mode == 'demographics'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          OUTPUT_PATH: ${{ runner.temp }}/prolific-demographics.csv
        run: python3 scripts/analysis/prolific_tools.py demographics

      - name: Find URL replies
        if: inputs.mode == 'find-url-replies'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
        run: python3 scripts/analysis/prolific_tools.py url-replies

      - name: Find stale return-requested submissions
        if: inputs.mode == 'stale-return-requested'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          STALE_HOURS: '48'
        run: python3 scripts/analysis/find_stale_return_requested.py

      - name: Search messages
        if: inputs.mode == 'search-messages'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          SEARCH_TERM: ${{ inputs.message }}
        run: |
          npx --no-install tsx -e "
          import { listStudySubmissions } from './src/lib/prolific-api';
          async function main() {
            const token = process.env.PROLIFIC_API_TOKEN!;
            const studyId = process.env.STUDY_ID!;
            const term = process.env.SEARCH_TERM!;
            console.log('Searching for:', term);
            const subs = await listStudySubmissions(studyId, token);
            for (const sub of subs.results || []) {
              try {
                const resp = await fetch('https://api.prolific.com/api/v1/messages/?user_id=' + sub.participant_id, {
                  headers: { 'Authorization': 'Token ' + token }
                });
                if (resp.ok) {
                  const data = await resp.json() as any;
                  const match = (data.results || []).some((m: any) => m.body && m.body.toLowerCase().includes(term.toLowerCase()));
                  if (match) {
                    console.log('');
                    console.log('FOUND: ' + sub.participant_id + ' | Status: ' + sub.status + ' | Time: ' + ((sub.time_taken || 0) / 60).toFixed(1) + ' min');
                    for (const m of data.results || []) {
                      if (m.body.toLowerCase().includes(term.toLowerCase())) {
                        console.log('  MSG: ' + m.body.substring(0, 300));
                      }
                    }
                  }
                }
              } catch {}
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Request return
        if: inputs.mode == 'request-return'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID: ${{ inputs.pid }}
        run: |
          npx --no-install tsx -e "
          import { listStudySubmissions } from './src/lib/prolific-api';
          async function main() {
            const token = process.env.PROLIFIC_API_TOKEN!;
            const studyId = process.env.STUDY_ID!;
            const pid = process.env.PID!;

            console.log('Looking up submission ID for PID:', pid);
            const subs = await listStudySubmissions(studyId, token);
            const sub = (subs.results || []).find((s: any) => s.participant_id === pid);
            if (!sub) { console.error('No submission found'); process.exit(1); }
            console.log('Submission ID:', sub.id, 'Status:', sub.status);

            if (sub.status !== 'AWAITING REVIEW') {
              console.log('Cannot request return - status is', sub.status);
              process.exit(1);
            }

            console.log('Requesting return via API...');
            const url = 'https://api.prolific.com/api/v1/submissions/' + sub.id + '/request-return/';
            const resp = await fetch(url, {
              method: 'POST',
              headers: {
                'Authorization': 'Token ' + token,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                request_return_reasons: [
                  'Failed embedded attention check questions designed to confirm careful reading'
                ]
              }),
            });

            const body = await resp.text();
            console.log('Response:', resp.status, body);

            if (!resp.ok) {
              console.error('Return request failed:', resp.status);
              process.exit(1);
            }
            console.log('Return requested successfully for', pid);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Send custom message
        if: inputs.mode == 'send-custom'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID: ${{ inputs.pid }}
          MESSAGE: ${{ inputs.message }}
          DRY_RUN: 'false'
        run: python3 scripts/analysis/send_custom_message.py

      - name: Unreject submissions
        if: inputs.mode == 'unreject'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID_LIST: ${{ inputs.pid }}
          DRY_RUN: 'false'
        run: python3 scripts/analysis/unreject_submissions.py

      - name: Send thank-you messages
        if: inputs.mode == 'send-thank-you'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID_LIST: ${{ inputs.pid }}
          DRY_RUN: 'false'
        run: python3 scripts/analysis/send_thank_you.py

      - name: Check all replies
        if: inputs.mode == 'all-replies'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
        run: python3 scripts/analysis/prolific_tools.py messages

      - name: List replied PIDs awaiting review
        if: inputs.mode == 'all-replies'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
        run: python3 scripts/analysis/prolific_tools.py replied-pids

      - name: Prolific submission status summary
        if: inputs.mode == 'all-replies'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
        run: python3 scripts/analysis/prolific_tools.py collect

      - name: Fetch submission details
        if: inputs.mode == 'single'
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID: ${{ inputs.pid }}
        run: |
          npx --no-install tsx -e "
          import { listStudySubmissions, listUserMessages } from './src/lib/prolific-api';
          async function main() {
            const token = process.env.PROLIFIC_API_TOKEN!;
            const studyId = process.env.STUDY_ID!;
            const pid = process.env.PID!;

            console.log('=== SUBMISSION STATUS ===');
            const subs = await listStudySubmissions(studyId, token);
            const sub = (subs.results || []).find((s: any) => s.participant_id === pid);
            if (sub) {
              console.log('Status:', sub.status);
              console.log('Started:', sub.started_at);
              console.log('Completed:', sub.completed_at);
              console.log('Time taken:', sub.time_taken, 'seconds');
            } else {
              console.log('No submission found for this PID');
            }

            console.log('');
            console.log('=== MESSAGES ===');
            try {
              const msgs = await listUserMessages(pid, token);
              const results = msgs.results || [];
              if (results.length === 0) {
                console.log('No messages found for this participant.');
              } else {
                console.log('Found', results.length, 'message(s):');
                for (const m of results) {
                  console.log('');
                  console.log('--- Message', m.id, '---');
                  console.log('  From:', m.sender_id);
                  console.log('  Sent:', m.sent_at);
                  console.log('  Channel:', m.channel_id);
                  console.log('  Study:', m.data?.study_id || 'N/A');
                  console.log('  Category:', m.data?.category || 'N/A');
                  console.log('  Body:', m.body);
                }
              }
            } catch (e) {
              console.log('Message retrieval failed:', e);
              console.log('Check Prolific UI for message history.');
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "

  triage-for-report:
    name: Export & Triage (for report)
    if: inputs.mode == 'awaiting-report'
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export Qualtrics responses
        run: python3 scripts/analysis/export_qualtrics.py
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          OUTPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv
      - name: Run disposition triage
        run: python3 scripts/analysis/disposition_triage.py
        env:
          INPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv
          OUTPUT_PATH: ${{ runner.temp }}/disposition.csv
      - uses: actions/upload-artifact@v7
        with:
          name: disposition-csv
          path: ${{ runner.temp }}/disposition.csv
          retention-days: 1

  awaiting-report:
    name: Awaiting Review Report
    if: inputs.mode == 'awaiting-report'
    needs: triage-for-report
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}
      - name: Generate awaiting review report
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
        run: npx --no-install tsx scripts/awaiting-review-report.ts

  verify-iri:
    name: Verify IRI Answers
    if: inputs.mode == 'single' && inputs.pid != ''
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify IRI answers from Qualtrics
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          PID: ${{ inputs.pid }}
        run: npx --no-install tsx scripts/verify-iri-answers.ts
