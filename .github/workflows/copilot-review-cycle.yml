name: Copilot Review Cycle

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: ['main']
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      round:
        description: 'Current review round (1-indexed)'
        required: false
        type: number
        default: 1
      max_rounds:
        description: 'Maximum review rounds'
        required: false
        type: number
        default: 7
      auto_merge:
        description: 'Auto-merge PR when review passes and CI is green'
        required: false
        type: boolean
        default: false

concurrency:
  group: copilot-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-cycle:
    name: Review Round ${{ github.event.inputs.round || '1' }}
    runs-on: ubuntu-latest
    environment: copilot
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Copilot review cycle
        run: npx tsx scripts/copilot-review-cycle.ts
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          ROUND: ${{ github.event.inputs.round || '1' }}
          MAX_ROUNDS: ${{ github.event.inputs.max_rounds || '7' }}
          AUTO_MERGE: ${{ github.event.inputs.auto_merge || 'false' }}
          REPO_NAME: ${{ github.repository }}
