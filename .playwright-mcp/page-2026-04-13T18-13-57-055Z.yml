                            - paragraph [ref=e721]: The TABS instrument demonstrates strong reliability (all α > .85, all CR > .87) and adequate factor structure at N=200. Readiness and Maturity show excellent CFA fit as unidimensional scales. Barriers is inherently multi-dimensional (2-factor EFA), so single-factor CFA fit is expected to be poor. All HTMT ratios pass the conservative .85 threshold. Any item-level flags (CITC < .30) are retained for substantive reasons. AVE values below .50 are compensated by CR > .80 per Fornell & Larcker (1981) and are typical for broad, multi-faceted organizational behavior constructs.
