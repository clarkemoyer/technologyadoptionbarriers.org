name: Scheduled GA Report

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    environment: google-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Report
        run: npx tsx scripts/generate-report.ts
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Upload impact data
        uses: actions/upload-artifact@v7
        with:
          name: ga-impact-data
          path: src/data/impact.json
          retention-days: 1

      - name: Upload report files
        uses: actions/upload-artifact@v7
        with:
          name: google-analytics-report
          path: reports/*.json
          retention-days: 30

      - name: Send Email Report
        if: success()
        run: npx tsx scripts/send-report-email.ts
        env:
          GOOGLE_PROJECT_OWNER_EMAIL: ${{ secrets.GOOGLE_PROJECT_OWNER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}

  create-pr:
    needs: generate-report
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download impact data
        uses: actions/download-artifact@v8
        with:
          name: ga-impact-data
          path: src/data

      - name: Format impact data
        run: npx prettier --write src/data/impact.json

      - name: Create pull request with updated impact stats
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          commit-message: 'chore: update public impact stats'
          title: 'Update Google Analytics impact stats'
          body: |
            Automated update of `src/data/impact.json` from the Google Analytics Data API.

            This PR contains the latest impact metrics from the daily GA report.
          branch: chore/ga-impact-stats
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
