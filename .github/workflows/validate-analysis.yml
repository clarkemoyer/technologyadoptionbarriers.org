name: Validate Analysis Pipeline

on:
  push:
    branches: ['main']
    paths:
      - 'src/lib/tabs-survey-constants.ts'
      - 'scripts/analysis/**'
      - '.github/workflows/validate-analysis.yml'

  pull_request:
    branches: ['main']
    paths:
      - 'src/lib/tabs-survey-constants.ts'
      - 'scripts/analysis/**'
      - '.github/workflows/validate-analysis.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-constants:
    name: Validate Shared Constants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate constants JSON from TypeScript
        run: npx --no-install tsx scripts/analysis/generate-constants-json.ts
      - name: Verify constants JSON was created
        run: |
          if [ ! -f scripts/analysis/tabs_v2_constants.json ]; then
            echo "ERROR: tabs_v2_constants.json was not generated"
            exit 1
          fi
          echo "tabs_v2_constants.json generated successfully"
      - name: Validate Python scripts load constants correctly
        run: |
          python3 << 'PYEOF'
          import json
          with open('scripts/analysis/tabs_v2_constants.json') as f:
              c = json.load(f)
          assert c['IRI_EXPECTED_ANSWERS']['barrier'] == 'Major Barrier'
          assert c['IRI_EXPECTED_ANSWERS']['readiness'] == 'Low Readiness/Capability'
          assert c['IRI_EXPECTED_ANSWERS']['maturity'] == 'Level 2: Developing/Repeatable'
          assert len(c['BARRIER_SCALE']) == 5
          assert len(c['READINESS_SCALE']) == 5
          assert len(c['MATURITY_SCALE']) == 5
          assert c['ITEM_COUNTS']['barriers'] == 18
          assert c['ITEM_COUNTS']['readiness'] == 17
          assert c['ITEM_COUNTS']['maturity'] == 8
          assert c['IRI_COLUMNS']['barrier'] == 'Q10-28_Barriers_19'
          assert c['IRI_COLUMNS']['readiness'] == 'Q47-64_Readiness_18'
          assert c['IRI_COLUMNS']['maturity'] == 'Q65-73_Maturity_9'
          assert c['COLUMN_PREFIXES']['barriers'] == 'Q10-28_Barriers_'
          assert c['COLUMN_PREFIXES']['readiness'] == 'Q47-64_Readiness_'
          assert c['COLUMN_PREFIXES']['maturity'] == 'Q65-73_Maturity_'
          print('All constant validations passed')
          PYEOF
      - name: Upload constants as artifact
        uses: actions/upload-artifact@v7
        with:
          name: tabs-constants-json
          path: scripts/analysis/tabs_v2_constants.json
          retention-days: 7

  test-analysis-scripts:
    name: Test Analysis Scripts
    runs-on: ubuntu-latest
    needs: validate-constants
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Generate constants JSON
        run: npx --no-install tsx scripts/analysis/generate-constants-json.ts
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r scripts/analysis/requirements.txt pytest
      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/analysis/tabs_v2_analysis.py
          python3 -m py_compile scripts/analysis/tabs_v2_psychometrics.py
          python3 -m py_compile scripts/analysis/tabs_v2_data_audit.py
          python3 -m py_compile scripts/analysis/tabs_v2_advanced.py
          python3 -m py_compile scripts/analysis/tabs_v2_quality_audit.py
          python3 -m py_compile scripts/analysis/enrich_qualtrics_csv.py
          python3 -m py_compile scripts/analysis/tabs_api.py
          echo "All Python scripts compile successfully"
      - name: Run pytest suite
        run: |
          cd scripts/analysis
          python3 -m pytest tests/ -v --tb=short 2>&1
      - name: Run analysis script on test data
        run: |
          cd scripts/analysis
          python3 tabs_v2_analysis.py tests/test_data_production_format.csv > analysis_output.txt 2>&1 || true
          tail -20 analysis_output.txt
          echo "Analysis script ran without fatal errors"
      - name: Test constants import in Python
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              with open('scripts/analysis/tabs_v2_constants.json') as f:
                  constants = json.load(f)
              for key in ['BARRIER_SCALE','READINESS_SCALE','MATURITY_SCALE','IRI_EXPECTED_ANSWERS','IRI_COLUMNS','COLUMN_PREFIXES','ITEM_COUNTS','DEMOGRAPHIC_COLUMNS']:
                  if key not in constants:
                      print(f'ERROR: Missing required constant: {key}')
                      sys.exit(1)
              print('All required constants are present')
          except Exception as e:
              print(f'ERROR: Failed to load constants: {e}')
              sys.exit(1)
          PYEOF
      - name: Upload test analysis output as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-analysis-output
          path: scripts/analysis/analysis_output.txt
          retention-days: 7

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-constants, test-analysis-scripts]
    if: always()
    steps:
      - name: Check validation status
        run: |
          echo "Validation Pipeline Results:"
          echo "  - Constants validation: ${{ needs.validate-constants.result }}"
          echo "  - Analysis script tests: ${{ needs.test-analysis-scripts.result }}"
      - name: Report success
        if: success()
        run: echo "All validation checks passed"
      - name: Report failure
        if: failure()
        run: |
          echo "Validation checks failed"
          exit 1
