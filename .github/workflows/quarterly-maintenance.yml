name: Quarterly Maintenance Reminder

# Creates a GitHub issue every quarter with a maintenance checklist.
# Replaces static MAINTENANCE.md checklists with tracked, actionable issues.
#
# Runs on the 1st of January, April, July, and October at 09:00 UTC.
# Can also be triggered manually at any time.

on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: quarterly-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-maintenance-issue:
    name: Create quarterly maintenance issue
    runs-on: ubuntu-latest

    steps:
      - name: Create maintenance checklist issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail

          QUARTER=$(date -u +%Y-Q$(($(date -u +%-m - 1) / 3 + 1)))
          TITLE="Quarterly maintenance checklist - ${QUARTER}"

          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "Quarterly maintenance checklist - ${QUARTER}" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open for ${QUARTER} - skipping creation"
            echo "SKIPPED=true" >> "$GITHUB_ENV"
            echo "QUARTER=${QUARTER}" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "QUARTER=${QUARTER}" >> "$GITHUB_ENV"

          ACTIONS_URL="${SERVER_URL}/${REPO}/actions/workflows"
          PULLS_URL="${SERVER_URL}/${REPO}/pulls?q=is%3Aopen+label%3Adependencies"
          SECURITY_URL="${SERVER_URL}/${REPO}/security/advisories"
          TODAY=$(date -u +%Y-%m-%d)

          {
            echo "## Quarterly Maintenance Checklist - ${QUARTER}"
            echo ""
            echo "This issue is auto-generated by \`.github/workflows/quarterly-maintenance.yml\`."
            echo "Work through each section and check items off as you go."
            echo "Close the issue when all items are resolved or explicitly deferred."
            echo ""
            echo "---"
            echo ""
            echo "### MCP Server Versions"
            echo ""
            echo "- [ ] Run the [Dependency Governance workflow](${ACTIONS_URL}/dependency-governance.yml) and review the step summary."
            echo "- [ ] Update \`acknowledged_release\` in \`.copilot/mcp-dependencies.json\` for any GitHub MCP repos that have new releases."
            echo "- [ ] Check [github/github-mcp-server releases](https://github.com/github/github-mcp-server/releases) for breaking changes."
            echo "- [ ] Check [cloudflare/mcp-server-cloudflare releases](https://github.com/cloudflare/mcp-server-cloudflare/releases) for breaking changes."
            echo "- [ ] Check [googleanalytics/google-analytics-mcp releases](https://github.com/googleanalytics/google-analytics-mcp/releases) for breaking changes."
            echo "- [ ] Check [MicrosoftDocs/mcp releases](https://github.com/MicrosoftDocs/mcp/releases) for breaking changes."
            echo ""
            echo "### PyPI Package Versions"
            echo ""
            echo "- [ ] Check if \`pyzotero\` has a new release: [PyPI history](https://pypi.org/project/pyzotero/#history). Current pin: see \`.copilot/mcp-dependencies.json\`."
            echo "- [ ] If \`pyzotero\` has a new minor/major version, update the pin in \`.github/workflows/zotero-create-collections.yml\` and \`.copilot/mcp-dependencies.json\`."
            echo "- [ ] Run [Zotero API Smoke Test](${ACTIONS_URL}/zotero-api-smoke.yml) to confirm connectivity after any updates."
            echo ""
            echo "### Analysis Package Versions"
            echo ""
            echo "- [ ] Review \`scripts/analysis/requirements.txt\` - check for updates to pandas, numpy, scipy, scikit-learn, statsmodels, matplotlib, seaborn."
            echo "- [ ] Review \`scripts/analysis/requirements-validation.txt\` - check factor_analyzer and semopy for updates."
            echo "- [ ] Any updates to analysis packages require re-running and validating the full analysis pipeline."
            echo ""
            echo "### API Compatibility"
            echo ""
            echo "- [ ] Run [Qualtrics API Smoke Test](${ACTIONS_URL}/qualtrics-api-smoke.yml)."
            echo "- [ ] Run [Prolific API Smoke Test](${ACTIONS_URL}/prolific-api-smoke.yml)."
            echo "- [ ] Run [Zotero API Smoke Test](${ACTIONS_URL}/zotero-api-smoke.yml)."
            echo "- [ ] Check Qualtrics API v3 changelog for deprecations: [Qualtrics developer docs](https://api.qualtrics.com/)."
            echo "- [ ] Check Prolific API v1 changelog for deprecations: [Prolific API docs](https://docs.prolific.com/docs/api-docs/public/)."
            echo "- [ ] Check [AAIF announcements](https://aaif.ai/) for any Qualtrics/SAP official MCP server release."
            echo "- [ ] Search GitHub for any new [Prolific MCP server](https://github.com/search?q=prolific+mcp&type=repositories) (none existed as of Apr 2026)."
            echo ""
            echo "### gh CLI Version"
            echo ""
            echo "- [ ] Confirm CI passes the \`gh --version >= 2.89\` check (required for \`gh agent-task create\`)."
            echo "- [ ] Check [gh CLI releases](https://github.com/cli/cli/releases) for any new features used in our workflows."
            echo ""
            echo "### Security and Dependency Audit"
            echo ""
            echo "- [ ] Review open [Dependabot PRs](${PULLS_URL}) and merge or close stale ones."
            echo "- [ ] Check [Security Advisories](${SECURITY_URL}) for any new vulnerabilities."
            echo "- [ ] Run \`npm audit\` locally and address any high/critical findings."
            echo "- [ ] Review \`uvx\` packages listed in CLAUDE.md for updates (pyzotero[mcp])."
            echo ""
            echo "### Documentation"
            echo ""
            echo "- [ ] Update the dependency risk chart in CLAUDE.md if any risk levels have changed."
            echo "- [ ] Update \`MCP_SERVERS.md\` if any MCP server configurations have changed."
            echo "- [ ] Verify \`TESTING.md\` accurately reflects current test infrastructure."
            echo ""
            echo "---"
            echo ""
            echo "*Auto-generated by \`.github/workflows/quarterly-maintenance.yml\` on ${TODAY}.*"
            echo "*Next reminder: scheduled for the 1st of the next quarter.*"
          } > /tmp/maintenance-body.md

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file /tmp/maintenance-body.md \
            --label "maintenance"

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Quarterly Maintenance Reminder"
            echo ""
            if [ "${SKIPPED:-}" = "true" ]; then
              echo "Issue already exists for ${QUARTER:-this quarter} - skipped creation."
            else
              echo "Maintenance checklist issue created for ${QUARTER:-this quarter}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
