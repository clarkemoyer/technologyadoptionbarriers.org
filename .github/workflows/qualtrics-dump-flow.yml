# Qualtrics Survey Flow Export (read-only)
#
# Dumps the live Survey Flow JSON for inspection / debugging.
# No data is modified - this is a GET-only operation.
#
# Outputs:
#   1. Flow JSON printed to the workflow log (for quick review).
#   2. A downloadable artifact retained for 30 days.
#
# Usage (GitHub CLI):
#   gh workflow run qualtrics-dump-flow.yml
#   gh workflow run qualtrics-dump-flow.yml -f survey_id=SV_abc123
#
# Usage (GitHub UI):
#   Actions → Qualtrics Survey Flow Export → Run workflow
#     - Optional: specify survey_id (defaults to QUALTRICS_SURVEY_ID env var)

name: Qualtrics Survey Flow Export

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      survey_id:
        description: 'Override survey ID (leave blank to use QUALTRICS_SURVEY_ID variable)'
        required: false
        default: ''

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dump-flow:
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    env:
      QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
      QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
      QUALTRICS_SURVEY_ID: ${{ inputs.survey_id || vars.QUALTRICS_SURVEY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dump Survey Flow JSON
        run: npx tsx scripts/qualtrics-dump-flow.ts

      - name: Print flow to log
        run: |
          echo "──────────────────────────────────────────"
          echo "Survey Flow for ${{ env.QUALTRICS_SURVEY_ID }}"
          echo "──────────────────────────────────────────"
          cat .vscode/qualtrics-flow.${{ env.QUALTRICS_SURVEY_ID }}.json
          echo ""

      - name: Upload flow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qualtrics-flow-${{ env.QUALTRICS_SURVEY_ID }}
          path: .vscode/qualtrics-flow.${{ env.QUALTRICS_SURVEY_ID }}.json
          retention-days: 30
