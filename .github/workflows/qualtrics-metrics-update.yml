name: Update Qualtrics Survey Metrics

on:
  workflow_dispatch:
    inputs:
      survey_id:
        description: 'Optional Survey ID (defaults to QUALTRICS_SURVEY_ID env var, else first survey returned by /surveys)'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    env:
      QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
      QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
      QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
      INPUT_SURVEY_ID: ${{ inputs.survey_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch metrics from Qualtrics
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="${RUNNER_TEMP:-/tmp}"
          SURVEYS_JSON="$TMP_DIR/qualtrics-surveys.json"
          SURVEY_JSON="$TMP_DIR/qualtrics-survey.json"

          if [[ -z "${QUALTRICS_API_TOKEN:-}" ]]; then
            echo "Missing secret QUALTRICS_API_TOKEN in environment qualtrics-prod"
            exit 1
          fi

          if [[ -z "${QUALTRICS_BASE_URL:-}" ]]; then
            echo "Missing env var QUALTRICS_BASE_URL in environment qualtrics-prod"
            exit 1
          fi

          BASE_URL="${QUALTRICS_BASE_URL%/}"
          SURVEY_ID="${INPUT_SURVEY_ID:-${QUALTRICS_SURVEY_ID:-}}"

          if [[ -z "${SURVEY_ID}" ]]; then
            url="${BASE_URL}/API/v3/surveys"
            http_code=$(curl -sS -o "$SURVEYS_JSON" -w "%{http_code}" \
              -H "X-API-TOKEN: ${QUALTRICS_API_TOKEN}" \
              -H "Accept: application/json" \
              "$url")

            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              echo "Request failed (HTTP $http_code): $url"
              head -c 4000 "$SURVEYS_JSON" || true
              exit 1
            fi

            SURVEY_ID=$(jq -r '.result.elements[0].id // empty' "$SURVEYS_JSON")
            if [[ -z "$SURVEY_ID" ]]; then
              echo "Could not auto-select a survey id from /surveys. Set QUALTRICS_SURVEY_ID or pass workflow input survey_id."
              exit 1
            fi
          fi

          url="${BASE_URL}/API/v3/surveys/${SURVEY_ID}"
          http_code=$(curl -sS -o "$SURVEY_JSON" -w "%{http_code}" \
            -H "X-API-TOKEN: ${QUALTRICS_API_TOKEN}" \
            -H "Accept: application/json" \
            "$url")

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Request failed (HTTP $http_code): $url"
            head -c 4000 "$SURVEY_JSON" || true
            exit 1
          fi

          collected_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          survey_name=$(jq -r '.result.name // ""' "$SURVEY_JSON")
          org_id=$(jq -r '.result.organizationId // ""' "$SURVEY_JSON")
          response_counts=$(jq -c '.result.responseCounts // {}' "$SURVEY_JSON")
          echo "Qualtrics responseCounts: $response_counts"

          # Fetch question count from full survey definition endpoint
          # Note: The /questions sub-resource returns paginated { elements: [] },
          # but the jq expression expects { Questions: {} }. Use the full
          # definition endpoint which returns .result.Questions as an object.
          DEFINITION_JSON="$TMP_DIR/qualtrics-definition.json"
          definition_url="${BASE_URL}/API/v3/survey-definitions/${SURVEY_ID}"

          # Question count is best-effort: a transient failure should not
          # abort the entire workflow since components have hardcoded fallbacks.
          question_count=0
          if q_http_code=$(curl -sS -o "$DEFINITION_JSON" -w "%{http_code}" \
            -H "X-API-TOKEN: ${QUALTRICS_API_TOKEN}" \
            -H "Accept: application/json" \
            "$definition_url"); then
            if [[ "$q_http_code" -ge 200 && "$q_http_code" -lt 300 ]]; then
              if parsed=$(jq '.result.Questions // {} | keys | length' "$DEFINITION_JSON" 2>&1); then
                question_count="$parsed"
                echo "Question count: $question_count"
              else
                echo "::warning::Failed to parse survey definition JSON. Setting question count to 0. jq output: $parsed"
              fi
            else
              echo "::warning::Could not fetch question count (HTTP $q_http_code). Setting to 0."
            fi
          else
            echo "::warning::curl failed for survey definition (network error). Setting question count to 0."
          fi

          mkdir -p src/data
          jq -n \
            --arg collectedAt "$collected_at" \
            --arg baseUrl "$BASE_URL" \
            --arg surveyId "$SURVEY_ID" \
            --arg surveyName "$survey_name" \
            --arg orgId "$org_id" \
            --argjson questionCount "$question_count" \
            --argjson responseCounts "$response_counts" \
            '{
              collectedAt: $collectedAt,
              baseUrl: $baseUrl,
              survey: {
                id: $surveyId,
                name: $surveyName,
                organizationId: $orgId
              },
              questionCount: $questionCount,
              responseCounts: $responseCounts,
              metrics: ($responseCounts | to_entries | map({metric: .key, value: .value}) | sort_by(.metric))
            }' > temp-qualtrics-metrics.json

          # --- VALIDATION STEP ---
          echo "Validating new metrics..."

          # 1. Check if valid JSON
          if ! jq -e . temp-qualtrics-metrics.json >/dev/null; then
            echo "::error::Generated file is invalid JSON."
            exit 1
          fi

          # 2. Check for empty metrics
          metric_count=$(jq '.metrics | length' temp-qualtrics-metrics.json)
          if [[ "$metric_count" -eq 0 ]]; then
            echo "::error::No metrics found in response."
            exit 1
          fi

          # 3. Regression check on RECORDED responses only.
          #
          # Qualtrics `responseCounts` has three buckets: `auditable` (recorded /
          # exportable responses -- the real data), `generated` (sessions started
          # but not yet recorded, i.e. partials in flight right now), and
          # `deleted` (responses currently in the trash). Only `auditable` is
          # cumulative and meaningful; `generated` and `deleted` are volatile and
          # legitimately drop to 0 between collection waves.
          #
          # The old guard summed all three and failed if the sum decreased. That
          # wedged this workflow from 2026-03-30 onward: `auditable` grew
          # (364 -> 975) while `generated`+`deleted` fell 1039 -> 0, so the sum
          # dropped (1403 -> 975) and every run hard-failed despite zero data
          # loss. Compare `auditable` instead, and only WARN on a decrease so a
          # transient dip can never block the daily refresh for months again.
          if [[ -f "src/data/qualtrics-metrics.json" ]]; then
            old_auditable=$(jq '.responseCounts.auditable // 0' src/data/qualtrics-metrics.json)
            new_auditable=$(jq '.responseCounts.auditable // 0' temp-qualtrics-metrics.json)

            echo "Auditable (recorded) responses: Old=$old_auditable, New=$new_auditable"

            if [[ "$new_auditable" -lt "$old_auditable" ]]; then
              echo "::warning::Auditable (recorded) response count decreased ($old_auditable -> $new_auditable). Publishing anyway -- verify no Qualtrics data loss."
            fi
          fi

          # If we got here, validation passed. Move file to final location.
          mv temp-qualtrics-metrics.json src/data/qualtrics-metrics.json
          echo "Validation passed. File updated."

      - name: Upload metrics data
        uses: actions/upload-artifact@v7
        with:
          name: qualtrics-metrics-data
          path: src/data/qualtrics-metrics.json
          retention-days: 1

  create-pr:
    needs: update-metrics
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download metrics data
        uses: actions/download-artifact@v8
        with:
          name: qualtrics-metrics-data
          path: src/data

      - name: Format data files
        run: npx prettier --write src/data/qualtrics-metrics.json

      - name: Create pull request with updated metrics
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          commit-message: 'Update Qualtrics survey metrics'
          title: 'Update Qualtrics survey metrics'
          body: |
            Automated update of `src/data/qualtrics-metrics.json` from the Qualtrics API.

            Each response count type is stored as its own metric for charting.

            **Validation Passed:**
            - JSON Integrity Verified.
            - Metrics Data Present.
            - No Regression in Total Response Counts.
          branch: chore/qualtrics-metrics
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
