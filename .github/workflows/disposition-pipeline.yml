name: TABS V2 Disposition Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - triage only, no Prolific approval'
        type: boolean
        default: true
      auto_accept_clean:
        description: 'Auto-accept CLEAN dispositions on Prolific'
        type: boolean
        default: false
      study_id:
        description: 'Prolific Study ID (defaults to PROLIFIC_STUDY_ID env var)'
        required: false
        type: string

concurrency:
  group: disposition-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Step 1: Export responses from Qualtrics
  # Step 2: Run disposition triage
  triage:
    name: Export & Triage
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Export Qualtrics responses
        run: python3 scripts/analysis/export_qualtrics.py
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          OUTPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv

      - name: Run disposition triage
        run: python3 scripts/analysis/disposition_triage.py
        env:
          INPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv
          OUTPUT_PATH: ${{ runner.temp }}/disposition.csv

      # Artifact is required to pass data between jobs. Contains only
      # PROLIFIC_PIDs and computed flags - no survey response data.
      # Retention is minimized; artifact is auto-deleted after 1 day.
      - name: Upload disposition CSV
        uses: actions/upload-artifact@v7
        with:
          name: disposition-csv
          path: ${{ runner.temp }}/disposition.csv
          retention-days: 1

  # Step 3: Auto-accept CLEAN submissions on Prolific
  # Requires PR #512 (approve-prolific-submissions.ts) to be merged first
  auto-accept:
    name: Prolific Auto-Accept
    needs: triage
    if: inputs.auto_accept_clean == true && inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - name: Validate study ID
        env:
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
        run: |
          if [ -z "$STUDY_ID" ]; then
            echo "::error::Study ID is required for auto-accept. Provide via input or set PROLIFIC_STUDY_ID env var."
            exit 1
          fi
          echo "Study ID: $STUDY_ID"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download disposition CSV
        uses: actions/download-artifact@v8
        with:
          name: disposition-csv
          path: ${{ runner.temp }}

      - name: Approve CLEAN submissions
        run: python3 scripts/analysis/approve_submissions.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          DRY_RUN: 'false'
