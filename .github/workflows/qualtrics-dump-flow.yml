name: Dump Qualtrics Survey Flow (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    env:
      QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
      QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
      QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dump survey flow JSON
        run: npx tsx scripts/qualtrics-dump-flow.ts

      - name: Print flow JSON to log
        run: cat .vscode/qualtrics-flow.${QUALTRICS_SURVEY_ID}.json

      - name: Upload flow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qualtrics-flow
          path: .vscode/qualtrics-flow.${{ env.QUALTRICS_SURVEY_ID }}.json
          retention-days: 3
