name: CRP Tools Smoke

# Runs the offline crp-document-tools end-to-end against the bundled
# synthetic fixture in scripts/crp-document-tools/fixtures/example_workspace/.
# The job is the technical receipt for the reproducibility claim in the
# subtree README: if the toolchain ever stops working from a clean checkout,
# this workflow fails and a contributor must repair it before merging.

on:
  pull_request:
    paths:
      - 'scripts/crp-document-tools/**'
      - '.github/workflows/crp-tools-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/crp-document-tools/**'
      - '.github/workflows/crp-tools-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Fixture-driven smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the fixture exists
        run: |
          set -euo pipefail
          fixture="scripts/crp-document-tools/fixtures/example_workspace"
          if [ ! -d "$fixture" ]; then
            echo "::error::Fixture missing: $fixture"
            exit 1
          fi
          csv="$fixture/05 TABS Survey Support/TABS Survey Data/TABS_V2_Enriched_CRP200_synthetic.csv"
          if [ ! -f "$csv" ]; then
            echo "::error::Synthetic CSV missing: $csv"
            exit 1
          fi
          echo "Fixture present"

      - name: Run compute_crp_stats_v2 against the fixture
        run: |
          set -euo pipefail
          out=$(python scripts/crp-document-tools/builders/compute_crp_stats_v2.py)
          echo "$out"

          # Smoke assertions: anything that ever rendered output should still render output.
          for marker in "V2 total: 28" "Conservative clean N: 20" "BARRIER RANKINGS" \
                        "READINESS RANKINGS" "MATURITY RANKINGS" "CORRELATIONS" \
                        "DEMOGRAPHICS" "DISPOSITION WATERFALL" "DONE"; do
            if ! echo "$out" | grep -F -q "$marker"; then
              echo "::error::compute_crp_stats_v2.py output missing marker: $marker"
              exit 1
            fi
          done
          echo "All smoke markers present."

      - name: Verify the fixture rebuilds deterministically
        run: |
          set -euo pipefail
          fixture="scripts/crp-document-tools/fixtures/example_workspace"

          # Hash every file in the fixture tree, sorted by path, to produce a
          # single digest covering the CSV, the appendix stubs, and the body
          # README. A single-file hash would miss nondeterminism in the other
          # outputs that build_example_workspace.py generates.
          # Capture per-file hashes before and after for a useful diff on failure.
          per_file_before=$(find "$fixture" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          before=$(echo "$per_file_before" | sha256sum | awk '{print $1}')

          # Regenerate
          python scripts/crp-document-tools/fixtures/build_example_workspace.py

          per_file_after=$(find "$fixture" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          after=$(echo "$per_file_after" | sha256sum | awk '{print $1}')

          if [ "$before" != "$after" ]; then
            echo "::error::Fixture rebuild produced different bytes - the build script lost determinism."
            echo "Differing files:"
            diff <(echo "$per_file_before") <(echo "$per_file_after") || true
            echo "before=$before"
            echo "after=$after"
            exit 1
          fi
          echo "Fixture rebuild is deterministic across all generated files (digest=$after)"

      - name: Verify paths.py discovery precedence
        run: |
          set -euo pipefail
          python - <<'PYTEST'
          import os, sys
          sys.path.insert(0, "scripts/crp-document-tools")
          from paths import find_workspace, FIXTURE_DIR, CrpWorkspaceNotFound

          # 1. With nothing set, falls through to the bundled fixture.
          os.environ.pop("CRP_WORKSPACE", None)
          ws = find_workspace()
          assert ws == FIXTURE_DIR, f"expected fixture fallback, got {ws}"

          # 2. Explicit bad path raises (no silent fallback).
          try:
              find_workspace(explicit="/definitely/does/not/exist")
              raise SystemExit("ERROR: bad explicit path did not raise")
          except CrpWorkspaceNotFound:
              pass

          # 3. CRP_WORKSPACE set to bad path raises (no silent fallback).
          os.environ["CRP_WORKSPACE"] = "/also/missing"
          try:
              find_workspace()
              raise SystemExit("ERROR: bad env did not raise")
          except CrpWorkspaceNotFound:
              pass
          os.environ.pop("CRP_WORKSPACE", None)

          print("paths.py discovery precedence verified")
          PYTEST
