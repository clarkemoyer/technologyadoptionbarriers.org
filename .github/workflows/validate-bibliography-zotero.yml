name: Validate Bibliography References vs Zotero

# Runs on PRs touching bibliography pages and on manual dispatch.
# Non-blocking for unmatched references (exit code 1 is allowed).
# Real script errors (exit code 2+, e.g. API outage or auth misconfig) fail CI.

on:
  pull_request:
    paths:
      - 'src/app/bibliography-*/page.tsx'
      - 'scripts/validate-bibliography-references.py'
      - '.github/workflows/validate-bibliography-zotero.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: zotero-prod
    # Skip on forked PRs: secrets/vars from zotero-prod are unavailable on forks
    # and GITHUB_TOKEN is read-only, so the job would fail with auth errors.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyzotero
        run: pip install pyzotero==1.11.0

      - name: Run bibliography-Zotero validation
        id: validate
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ vars.ZOTERO_USER_ID }}
          ZOTERO_BASE_URL: ${{ vars.ZOTERO_BASE_URL }}
          VALIDATION_REPORT_PATH: bibliography-validation-report.json
        run: |
          set +e
          python scripts/validate-bibliography-references.py
          EXIT_CODE=$?
          echo "report_path=bibliography-validation-report.json" >> "$GITHUB_OUTPUT"
          # Exit code 1 = unmatched refs (non-blocking warning) — allow
          # Exit code 2+ = real script error (broken env, API outage) — fail CI
          if [ "$EXIT_CODE" -le 1 ]; then
            exit 0
          else
            exit "$EXIT_CODE"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliography-validation-report
          path: bibliography-validation-report.json
          retention-days: 30

      - name: Post PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('bibliography-validation-report.json', 'utf8'));
            } catch (e) {
              console.log('No validation report found — skipping comment');
              return;
            }

            const pct = report.total_refs > 0
              ? Math.round(report.matched * 100 / report.total_refs)
              : 0;

            let body = `## Zotero Bibliography Validation\n\n`;

            if (report.error) {
              body += `> ⚠️ **Validation error — Zotero results are incomplete:**\n> ${report.error}\n\n`;
            }

            body += `| Metric | Value |\n|---|---|\n`;
            body += `| Pages with References | ${report.pages_with_refs} / ${report.total_pages} |\n`;
            body += `| Total references | ${report.total_refs} |\n`;
            if (!report.error) {
              body += `| Matched in Zotero | ${report.matched} (${pct}%) |\n`;
              if (report.possible_matches > 0) {
                body += `| Possible matches (verify manually) | ${report.possible_matches} |\n`;
              }
              body += `| Unmatched | ${report.unmatched} |\n`;
            }
            body += '\n';

            if (!report.error && report.possible_matches > 0 && report.possible_match_details?.length > 0) {
              body += `<details><summary>${report.possible_matches} possible matches (fuzzy year+prefix overlap — verify manually)</summary>\n\n`;
              body += `| Page | Reference |\n|---|---|\n`;
              for (const d of report.possible_match_details.slice(0, 20)) {
                body += `| \`${d.page}\` | ${d.ref} |\n`;
              }
              if (report.possible_match_details.length > 20) {
                body += `| ... | ${report.possible_match_details.length - 20} more |\n`;
              }
              body += `\n</details>\n\n`;
            }

            if (!report.error && report.unmatched > 0 && report.unmatched_details.length > 0) {
              body += `<details><summary>${report.unmatched} references not found in Zotero (click to expand)</summary>\n\n`;
              body += `| Page | Reference |\n|---|---|\n`;
              for (const d of report.unmatched_details.slice(0, 50)) {
                body += `| \`${d.page}\` | ${d.ref} |\n`;
              }
              if (report.unmatched_details.length > 50) {
                body += `| ... | ${report.unmatched_details.length - 50} more |\n`;
              }
              body += `\n</details>\n\n`;
            }

            body += `> Per [#1553](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/1553): all references must exist in Zotero and use APA 7th format.\n`;

            // Find and update existing comment or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Zotero Bibliography Validation';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
