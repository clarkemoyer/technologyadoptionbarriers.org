name: Post-Deploy Smoke Test

on:
  # Runs automatically after every successful deployment
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types:
      - completed
    branches: ['main']

  # Allow manual trigger for ad-hoc testing
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to test (default: production)'
        required: false
        type: string
        default: 'https://technologyadoptionbarriers.org'

permissions:
  contents: read
  issues: write
  statuses: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    # Run on manual trigger or successful deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      SITE_URL: >-
        ${{ github.event_name == 'workflow_dispatch'
            && github.event.inputs.site_url
            || 'https://technologyadoptionbarriers.org' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On workflow_run, checkout the exact commit that was deployed
          # to avoid false failures from newer commits adding routes
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Normalize SITE_URL
        run: |
          # Strip trailing slash to avoid double-slash in URL construction
          echo "SITE_URL=${SITE_URL%/}" >> "$GITHUB_ENV"

      - name: Build site to discover all routes
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      # ── Route & asset discovery ──────────────────────────────────────

      - name: Discover all page routes
        run: |
          set -uo pipefail

          # With trailingSlash: true, every page is at path/index.html
          find out -name 'index.html' -not -path 'out/404/*' | sort | while read -r f; do
            dir=$(dirname "$f")
            path="${dir#out}"
            [ -z "$path" ] && path="/"
            echo "$path"
          done > /tmp/routes.txt

          ROUTE_COUNT=$(wc -l < /tmp/routes.txt)
          echo "📄 Discovered $ROUTE_COUNT page routes"
          cat /tmp/routes.txt

      - name: Discover all static assets
        run: |
          set -uo pipefail

          # Find every non-HTML file, excluding:
          #   - dotfiles (e.g. .nojekyll, .gitkeep) - GitHub Pages does
          #     not serve files whose names start with '.'
          #   - _next/static/** (build-specific hashed paths that differ
          #     between the deploy build and this discovery build; pages
          #     already validate these assets implicitly when they return 200)
          #   - sitemap-[0-9]*.xml (Next.js may generate numbered sitemaps
          #     like sitemap-0.xml that differ between builds; the
          #     infrastructure checks already verify sitemap.xml separately)
          find out -type f \
            -not -name '*.html' \
            -not -name '.*' \
            -not -name 'sitemap-[0-9]*.xml' \
            -not -path 'out/_next/static/*' \
            | sort | while read -r f; do
            echo "/${f#out/}"
          done > /tmp/assets.txt

          ASSET_COUNT=$(wc -l < /tmp/assets.txt)
          echo "🖼️  Discovered $ASSET_COUNT static assets"
          cat /tmp/assets.txt

      # ── Wait for CDN propagation (auto-trigger only) ─────────────────

      - name: Wait for CDN propagation
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "⏳ Waiting 30 seconds for CDN propagation..."
          sleep 30

      # ── Create reusable test scripts ─────────────────────────────────

      - name: Create test helper scripts
        run: |
          # Page route checker (GET with retry)
          cat > /tmp/check-url.sh << 'SCRIPT'
          #!/usr/bin/env bash
          url="$1"
          expected="${2:-200}"
          label="$3"
          status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$url" 2>/dev/null || echo "000")
          if [ "$status" != "$expected" ]; then
            sleep 3
            status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$url" 2>/dev/null || echo "000")
          fi
          if [ "$status" = "$expected" ]; then
            echo "PASS $label"
          else
            echo "FAIL $status $label (expected $expected)"
          fi
          SCRIPT
          chmod +x /tmp/check-url.sh

          # Asset checker (HEAD with retry for transient CDN errors like 503)
          cat > /tmp/check-asset.sh << 'SCRIPT'
          #!/usr/bin/env bash
          url="$1"
          expected="${2:-200}"
          label="$3"
          status=$(curl -s -o /dev/null -w '%{http_code}' --head -L --max-time 15 "$url" 2>/dev/null || echo "000")
          if [ "$status" != "$expected" ]; then
            sleep 3
            status=$(curl -s -o /dev/null -w '%{http_code}' --head -L --max-time 15 "$url" 2>/dev/null || echo "000")
          fi
          if [ "$status" = "$expected" ]; then
            echo "PASS $label"
          else
            echo "FAIL $status $label (expected $expected)"
          fi
          SCRIPT
          chmod +x /tmp/check-asset.sh

      # ── Test all page routes ─────────────────────────────────────────

      - name: Test all page routes (with and without trailing slash)
        run: |
          set -uo pipefail

          # Build test list: each line is "FULL_URL EXPECTED_STATUS LABEL"
          while IFS= read -r path; do
            echo "${SITE_URL}${path} 200 ${path}"
            # Also test with trailing slash (skip / which already ends with /)
            if [ "$path" != "/" ]; then
              echo "${SITE_URL}${path}/ 200 ${path}/"
            fi
          done < /tmp/routes.txt > /tmp/route-tests.txt

          ROUTE_TEST_COUNT=$(wc -l < /tmp/route-tests.txt)
          echo "🔍 Testing $ROUTE_TEST_COUNT page URLs (with and without trailing slash)..."

          # Run tests in parallel (20 concurrent connections)
          xargs -P 20 -L 1 /tmp/check-url.sh < /tmp/route-tests.txt > /tmp/route-results.txt

          PASS=$(grep -c '^PASS' /tmp/route-results.txt || true)
          FAIL=$(grep -c '^FAIL' /tmp/route-results.txt || true)

          echo ""
          echo "Page routes: ✅ $PASS passed, ❌ $FAIL failed (of $ROUTE_TEST_COUNT)"

          {
            echo "ROUTE_PASS=$PASS"
            echo "ROUTE_FAIL=$FAIL"
            echo "ROUTE_TOTAL=$ROUTE_TEST_COUNT"
          } >> "$GITHUB_ENV"

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "Failed URLs:"
            grep '^FAIL' /tmp/route-results.txt
          fi

      # ── Test all static assets ───────────────────────────────────────

      - name: Test all static assets
        run: |
          set -uo pipefail

          # Build asset test list
          while IFS= read -r path; do
            echo "${SITE_URL}${path} 200 ${path}"
          done < /tmp/assets.txt > /tmp/asset-tests.txt

          ASSET_TEST_COUNT=$(wc -l < /tmp/asset-tests.txt)
          echo "🔍 Testing $ASSET_TEST_COUNT static assets..."

          # Run tests in parallel (20 concurrent, HEAD requests)
          xargs -P 20 -L 1 /tmp/check-asset.sh < /tmp/asset-tests.txt > /tmp/asset-results.txt

          PASS=$(grep -c '^PASS' /tmp/asset-results.txt || true)
          FAIL=$(grep -c '^FAIL' /tmp/asset-results.txt || true)

          echo "Static assets: ✅ $PASS passed, ❌ $FAIL failed (of $ASSET_TEST_COUNT)"

          {
            echo "ASSET_PASS=$PASS"
            echo "ASSET_FAIL=$FAIL"
            echo "ASSET_TOTAL=$ASSET_TEST_COUNT"
          } >> "$GITHUB_ENV"

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "Failed assets:"
            grep '^FAIL' /tmp/asset-results.txt
          fi

      # ── Infrastructure checks ────────────────────────────────────────

      - name: Infrastructure checks
        run: |
          set -uo pipefail
          INFRA_FAIL=0

          # Helper: check URL status with label
          check() {
            local label="$1" url="$2" expected="$3"
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$url" 2>/dev/null || echo "000")
            if [ "$status" = "$expected" ]; then
              echo "| $label | ✅ $status |" >> /tmp/infra-results.txt
            else
              echo "| $label | ❌ $status (expected $expected) |" >> /tmp/infra-results.txt
              INFRA_FAIL=$((INFRA_FAIL + 1))
            fi
          }

          : > /tmp/infra-results.txt

          # 1. 404 error handling - nonexistent URL must return 404
          # NOTE: This path is reserved for smoke testing and must NEVER be created as a real page.
          check "404 error page" "${SITE_URL}/__smoke-test-404-check__" "404"

          # 2. sitemap.xml - SEO infrastructure
          check "sitemap.xml" "${SITE_URL}/sitemap.xml" "200"

          # 3. robots.txt - crawler configuration
          check "robots.txt" "${SITE_URL}/robots.txt" "200"

          # 4. CNAME - custom domain configuration
          check "CNAME" "${SITE_URL}/CNAME" "200"

          # 5. site.webmanifest - PWA metadata
          check "site.webmanifest" "${SITE_URL}/site.webmanifest" "200"

          # 6. Homepage content verification - validates rendering, not just status
          CONTENT=$(curl -s -L --max-time 15 "${SITE_URL}/" 2>/dev/null)
          if echo "$CONTENT" | grep -q "Technology Adoption Barriers"; then
            echo "| Homepage content | ✅ Contains expected text |" >> /tmp/infra-results.txt
          else
            echo "| Homepage content | ❌ Missing expected text |" >> /tmp/infra-results.txt
            INFRA_FAIL=$((INFRA_FAIL + 1))
          fi

          # 7. Content-Type for HTML pages - must serve text/html
          CT=$(curl -s -I -L --max-time 15 "${SITE_URL}/" 2>/dev/null | grep -i '^content-type:' | head -1)
          if echo "$CT" | grep -qi 'text/html'; then
            echo "| HTML Content-Type | ✅ text/html |" >> /tmp/infra-results.txt
          else
            echo "| HTML Content-Type | ❌ ${CT:-missing} |" >> /tmp/infra-results.txt
            INFRA_FAIL=$((INFRA_FAIL + 1))
          fi

          # 8. HTTPS redirect - HTTP must redirect to HTTPS
          # Intentionally non-blocking (⚠️ not ❌): CI runners may have network
          # restrictions that prevent following HTTP→HTTPS redirects, so a
          # failure here does NOT increment INFRA_FAIL.
          HTTP_URL=$(echo "${SITE_URL}" | sed 's|^https://|http://|')
          FINAL_URL=$(curl -s -o /dev/null -w '%{url_effective}' -L --max-time 15 "${HTTP_URL}" 2>/dev/null || echo "")
          if echo "$FINAL_URL" | grep -q '^https://'; then
            echo "| HTTPS redirect | ✅ HTTP → HTTPS |" >> /tmp/infra-results.txt
          else
            echo "| HTTPS redirect | ⚠️ Could not verify (${FINAL_URL:-timeout}) |" >> /tmp/infra-results.txt
          fi

          echo ""
          echo "Infrastructure: $INFRA_FAIL failed"
          cat /tmp/infra-results.txt

          echo "INFRA_FAIL=$INFRA_FAIL" >> "$GITHUB_ENV"

      # ── Redirect validation ─────────────────────────────────────────

      - name: Validate redirects reach correct destinations
        run: |
          set -uo pipefail
          REDIRECT_FAIL=0

          # Helper: verify redirect via HTTP 3xx OR static stub page (JS/link)
          check_redirect() {
            local old_url="$1" expected_path="$2" label="$3"
            local final_url page_html

            # Try HTTP redirect first
            final_url=$(curl -s -o /dev/null -w '%{url_effective}' -L --max-time 15 "$old_url" 2>/dev/null || echo "")
            if echo "$final_url" | grep -F -q "$expected_path"; then
              echo "| $label | ✅ HTTP redirect → $expected_path |" >> /tmp/redirect-results.txt
              return
            fi

            # Fall back to checking whether the stub page contains the expected path
            page_html=$(curl -sL --max-time 15 "$old_url" 2>/dev/null || echo "")
            if echo "$page_html" | grep -F -q -- "$expected_path"; then
              echo "| $label | ✅ Stub page → $expected_path |" >> /tmp/redirect-results.txt
            else
              echo "| $label | ❌ → ${final_url:-timeout} (expected $expected_path) |" >> /tmp/redirect-results.txt
              REDIRECT_FAIL=$((REDIRECT_FAIL + 1))
            fi
          }

          : > /tmp/redirect-results.txt

          # Legacy redirects between Making of TABS and Results sections
          check_redirect "${SITE_URL}/making-of-tabs/data-analysis" "/results/data-quality" "/making-of-tabs/data-analysis"
          # CMO Survey moved TO making-of-tabs in PR #1516; /results/cmo-survey has a ClientRedirect stub
          check_redirect "${SITE_URL}/results/cmo-survey" "/making-of-tabs/cmo-survey" "/results/cmo-survey"
          check_redirect "${SITE_URL}/making-of-tabs/reproducible-analysis" "/results/reproducibility" "/making-of-tabs/reproducible-analysis"
          check_redirect "${SITE_URL}/making-of-tabs/integrations/prolific/dashboard" "/results/dashboard" "/making-of-tabs/.../prolific/dashboard"
          check_redirect "${SITE_URL}/barriers/survey-stats" "/results/survey-stats" "/barriers/survey-stats"

          echo ""
          echo "Redirects: $REDIRECT_FAIL failed"
          cat /tmp/redirect-results.txt

          echo "REDIRECT_FAIL=$REDIRECT_FAIL" >> "$GITHUB_ENV"

      # ── Pipeline data rendering ─────────────────────────────────────

      - name: Verify pipeline data renders on pages
        run: |
          set -uo pipefail
          DATA_FAIL=0

          : > /tmp/data-results.txt

          # JSON data files are bundled into pages at build time (not served
          # as static files). Verify rendered pages contain data-derived values
          # that would only appear if pipeline JSON was present at build.

          # Shared fetch: sets FETCH_OK (0=success, 1=error) and writes body to /tmp/data-body.
          # Always returns 0 so the caller can record failures and continue this step.
          fetch_data_page() {
            local url="$1" label="$2"
            local status curl_exit
            FETCH_OK=1
            : > /tmp/data-body
            status=$(curl -s -o /tmp/data-body -w '%{http_code}' -L --max-time 15 "$url" 2>/dev/null)
            curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              status="000"
            fi
            if [ "$status" != "200" ]; then
              echo "| $label | ❌ HTTP $status (expected 200) |" >> /tmp/data-results.txt
              DATA_FAIL=$((DATA_FAIL + 1))
              return 0
            fi
            FETCH_OK=0
            return 0
          }

          check_data_marker() {
            local url="$1" marker="$2" label="$3"
            fetch_data_page "$url" "$label"
            [ "$FETCH_OK" -ne 0 ] && return 0
            if grep -F -q -- "$marker" /tmp/data-body; then
              echo "| $label | ✅ Data renders |" >> /tmp/data-results.txt
            else
              echo "| $label | ❌ Missing: $marker |" >> /tmp/data-results.txt
              DATA_FAIL=$((DATA_FAIL + 1))
            fi
          }

          # Regex variant: matches a pattern instead of a fixed string
          check_data_regex() {
            local url="$1" pattern="$2" label="$3"
            local grep_status
            fetch_data_page "$url" "$label"
            [ "$FETCH_OK" -ne 0 ] && return 0
            grep_status=0
            grep -qE -- "$pattern" /tmp/data-body || grep_status=$?
            if [ "$grep_status" -eq 0 ]; then
              echo "| $label | ✅ Data renders |" >> /tmp/data-results.txt
            elif [ "$grep_status" -eq 1 ]; then
              echo "| $label | ❌ Missing pattern: $pattern |" >> /tmp/data-results.txt
              DATA_FAIL=$((DATA_FAIL + 1))
            else
              echo "| $label | ❌ Regex error: $pattern |" >> /tmp/data-results.txt
              DATA_FAIL=$((DATA_FAIL + 1))
            fi
          }

          # sensitivity-analysis.json → descriptive page renders sample labels with N values
          # Note: RSC serialization splits "Conservative Clean" and "(N=78)" across chunks,
          # so we check for the label which only appears when JSON data is loaded.
          check_data_marker "${SITE_URL}/results/descriptive" "Conservative Clean" "sensitivity → descriptive"

          # sensitivity-analysis.json → data-quality page renders sample definitions table
          check_data_marker "${SITE_URL}/results/data-quality" "Conservative Clean" "sensitivity → data-quality"

          # disposition-summary.json → dashboard page renders approval counts
          check_data_marker "${SITE_URL}/results/dashboard" "Approved" "disposition → dashboard"

          # sensitivity-analysis.json → reliability page renders 4-decimal alpha values
          # A value like "0.8576" only appears when computed from JSON data via .toFixed(4)
          check_data_regex "${SITE_URL}/results/reliability" "0\.[0-9]{4}" "alphas → reliability"

          echo ""
          echo "Pipeline data rendering: $DATA_FAIL failed"
          cat /tmp/data-results.txt

          echo "DATA_FAIL=$DATA_FAIL" >> "$GITHUB_ENV"

      # ── Content spot-checks ──────────────────────────────────────────

      - name: Content validation for key pages
        run: |
          set -uo pipefail
          CONTENT_FAIL=0

          check_content() {
            local url="$1" expected="$2" label="$3"
            local http_status
            local curl_exit

            http_status="$(curl -s -L --max-time 15 --write-out '%{http_code}' "$url" -o /tmp/content-body 2>/dev/null)"
            curl_exit=$?

            if [ "$curl_exit" -ne 0 ] || [ "$http_status" -lt 200 ] || [ "$http_status" -ge 400 ]; then
              : > /tmp/content-body
              echo "| $label | ❌ Fetch failed (curl=$curl_exit, http=$http_status) |" >> /tmp/content-results.txt
              CONTENT_FAIL=$((CONTENT_FAIL + 1))
              return
            fi

            if grep -q "$expected" /tmp/content-body 2>/dev/null; then
              echo "| $label | ✅ Contains: \"$expected\" |" >> /tmp/content-results.txt
            else
              echo "| $label | ❌ Missing: \"$expected\" |" >> /tmp/content-results.txt
              CONTENT_FAIL=$((CONTENT_FAIL + 1))
            fi
          }

          : > /tmp/content-results.txt

          # Results section - verify key content renders.
          # 'Prolific Accepted' replaced 'Prolific Approved' as the hero-stat label
          # in PR #1709 (commit 73b6e3b1, "Prolific Accepted label").
          check_content "${SITE_URL}/results" "Prolific Accepted" "/results overview"
          check_content "${SITE_URL}/results" "Clean Sample" "/results hero stats"
          check_content "${SITE_URL}/results/data-quality" "Disposition Waterfall" "/results/data-quality"
          check_content "${SITE_URL}/results/descriptive" "Grand Mean" "/results/descriptive"
          check_content "${SITE_URL}/results/reliability" "Cronbach" "/results/reliability"
          check_content "${SITE_URL}/results/sensitivity" "Conservative Clean" "/results/sensitivity"

          # Issue #1839 - validation/factor/reliability/findings page sections
          # added in PR #1853. These assertions guarantee the new statistical
          # content from PR #1837's pipeline (28 new keys) actually surfaces.
          # Each headline must be present on both the live and CRP tracks.
          # If a check fails, the smoke workflow auto-files an issue (like
          # #1849) so the regression gets investigated, not silently hidden.

          # Validation page: bifactor + assumption-checks sections (Pass 1)
          check_content "${SITE_URL}/results/validation" "Bifactor Analyses" "/results/validation bifactor"
          check_content "${SITE_URL}/results/validation" "Assumption Checks" "/results/validation assumption-checks"
          check_content "${SITE_URL}/results/crp-2026/validation" "Bifactor Analyses" "/results/crp-2026/validation bifactor"
          check_content "${SITE_URL}/results/crp-2026/validation" "Assumption Checks" "/results/crp-2026/validation assumption-checks"

          # Factor analysis page: Multi-Group + ESEM sections (Pass 2). These
          # render only when the data is present, so a PR that breaks the
          # pipeline output for these keys will trip the smoke test.
          # Both live and CRP tracks have multigroup/ESEM data, so both are checked.
          check_content "${SITE_URL}/results/factor-analysis" "Multi-Group Stability" "/results/factor-analysis multi-group"
          check_content "${SITE_URL}/results/factor-analysis" "ESEM Sensitivity" "/results/factor-analysis esem"
          check_content "${SITE_URL}/results/crp-2026/factor-analysis" "Multi-Group Stability" "/results/crp-2026/factor-analysis multi-group"
          check_content "${SITE_URL}/results/crp-2026/factor-analysis" "ESEM Sensitivity" "/results/crp-2026/factor-analysis esem"

          # Reliability page: bootstrap CI + alpha-if-deleted (Pass 3).
          # Both live and CRP validation JSON include a populated reliability_by_demo
          # block, so "Reliability by Demographic" is asserted on both tracks.
          check_content "${SITE_URL}/results/reliability" "Bootstrap Confidence" "/results/reliability bootstrap"
          check_content "${SITE_URL}/results/reliability" "Alpha if Deleted" "/results/reliability alpha-if-deleted"
          check_content "${SITE_URL}/results/reliability" "Reliability by Demographic" "/results/reliability by-demo"
          check_content "${SITE_URL}/results/crp-2026/reliability" "Bootstrap Confidence" "/results/crp-2026/reliability bootstrap"
          check_content "${SITE_URL}/results/crp-2026/reliability" "Alpha if Deleted" "/results/crp-2026/reliability alpha-if-deleted"
          check_content "${SITE_URL}/results/crp-2026/reliability" "Reliability by Demographic" "/results/crp-2026/reliability by-demo"

          # Findings page: Inferential Extensions section (Pass 4)
          check_content "${SITE_URL}/results/findings" "Inferential Extensions" "/results/findings inferential-extensions"
          check_content "${SITE_URL}/results/crp-2026/findings" "Inferential Extensions" "/results/crp-2026/findings inferential-extensions"

          # Data quality page: Pipeline & Data Flow diagram (Pass 5).
          # Heading must remain present on both tracks - it is the permanent
          # home for the defense-presentation 11-stage pipeline visualization.
          check_content "${SITE_URL}/results/data-quality" "Pipeline and Data Flow" "/results/data-quality pipeline-flow"
          check_content "${SITE_URL}/results/crp-2026/data-quality" "Pipeline and Data Flow" "/results/crp-2026/data-quality pipeline-flow"

          # Barriers page - still functional
          check_content "${SITE_URL}/barriers" "Technology Adoption Barriers" "/barriers"

          # Making of TABS - still functional after restructure
          check_content "${SITE_URL}/making-of-tabs" "Making of TABS" "/making-of-tabs"

          # Check for pipeline data failure sentinel on key pages.
          # Pages render "[DATA UNAVAILABLE - pipeline error]" when JSON data
          # is missing or malformed. Any occurrence is a pipeline failure.
          SENTINEL_FAIL=0
          check_no_sentinel() {
            local url="$1" label="$2"
            local http_status curl_exit

            http_status="$(curl -s -L --max-time 15 --write-out '%{http_code}' "$url" -o /tmp/sentinel-body 2>/dev/null)"
            curl_exit=$?

            if [ "$curl_exit" -ne 0 ] || [ "$http_status" -lt 200 ] || [ "$http_status" -ge 400 ]; then
              : > /tmp/sentinel-body
              echo "| $label | ❌ Fetch failed (curl=$curl_exit, http=$http_status) - sentinel check inconclusive |" >> /tmp/content-results.txt
              SENTINEL_FAIL=$((SENTINEL_FAIL + 1))
              return
            fi

            if grep -F -q -- "[DATA UNAVAILABLE - pipeline error]" /tmp/sentinel-body 2>/dev/null; then
              echo "| $label | ❌ Contains [DATA UNAVAILABLE] sentinel - pipeline data missing |" >> /tmp/content-results.txt
              SENTINEL_FAIL=$((SENTINEL_FAIL + 1))
            else
              echo "| $label | ✅ No data-unavailable markers |" >> /tmp/content-results.txt
            fi
          }

          check_no_sentinel "${SITE_URL}/results/sample" "/results/sample"
          check_no_sentinel "${SITE_URL}/results/findings" "/results/findings"
          check_no_sentinel "${SITE_URL}/results/dataset-comparison" "/results/dataset-comparison"
          check_no_sentinel "${SITE_URL}/results/crp-2026" "/results/crp-2026"
          check_no_sentinel "${SITE_URL}/results/crp-2026/sample" "/results/crp-2026/sample"
          check_no_sentinel "${SITE_URL}/results/crp-2026/findings" "/results/crp-2026/findings"
          check_no_sentinel "${SITE_URL}/results/crp-2026/validation" "/results/crp-2026/validation"
          check_no_sentinel "${SITE_URL}/results/crp-2026/factor-analysis" "/results/crp-2026/factor-analysis"

          CONTENT_FAIL=$((CONTENT_FAIL + SENTINEL_FAIL))

          echo ""
          echo "Content validation: $CONTENT_FAIL failed (including $SENTINEL_FAIL data-unavailable checks)"
          cat /tmp/content-results.txt

          echo "CONTENT_FAIL=$CONTENT_FAIL" >> "$GITHUB_ENV"

      # ── Job summary ──────────────────────────────────────────────────

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "# 🔍 Post-Deploy Smoke Test Results"
            echo ""
            echo "**Site:** \`${SITE_URL}\`"
            echo ""

            # ── Page routes ──
            echo "## 📄 Page Routes"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed | ${ROUTE_PASS:-0} |"
            echo "| ❌ Failed | ${ROUTE_FAIL:-0} |"
            echo "| Total | ${ROUTE_TOTAL:-0} |"
            echo ""

            if [ -f /tmp/route-results.txt ] && grep -q '^FAIL' /tmp/route-results.txt 2>/dev/null; then
              echo "<details><summary>❌ Failed Routes</summary>"
              echo ""
              echo '```'
              grep '^FAIL' /tmp/route-results.txt
              echo '```'
              echo "</details>"
              echo ""
            fi

            # ── Static assets ──
            echo "## 🖼️ Static Assets"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed | ${ASSET_PASS:-0} |"
            echo "| ❌ Failed | ${ASSET_FAIL:-0} |"
            echo "| Total | ${ASSET_TOTAL:-0} |"
            echo ""

            if [ -f /tmp/asset-results.txt ] && grep -q '^FAIL' /tmp/asset-results.txt 2>/dev/null; then
              echo "<details><summary>❌ Failed Assets</summary>"
              echo ""
              echo '```'
              grep '^FAIL' /tmp/asset-results.txt
              echo '```'
              echo "</details>"
              echo ""
            fi

            # ── Infrastructure ──
            echo "## 🔧 Infrastructure Checks"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            if [ -f /tmp/infra-results.txt ]; then
              cat /tmp/infra-results.txt
            fi
            echo ""

            # ── Redirects ──
            echo "## 🔀 Redirect Validation"
            echo ""
            echo "| Old URL | Result |"
            echo "|---------|--------|"
            if [ -f /tmp/redirect-results.txt ]; then
              cat /tmp/redirect-results.txt
            fi
            echo ""

            # ── Data freshness ──
            echo "## 📊 Pipeline Data Validation"
            echo ""
            echo "| File | Result |"
            echo "|------|--------|"
            if [ -f /tmp/data-results.txt ]; then
              cat /tmp/data-results.txt
            fi
            echo ""

            # ── Content validation ──
            echo "## 📝 Content Spot-Checks"
            echo ""
            echo "| Page | Result |"
            echo "|------|--------|"
            if [ -f /tmp/content-results.txt ]; then
              cat /tmp/content-results.txt
            fi
            echo ""

            # ── Overall result ──
            TOTAL_FAIL=$(( ${ROUTE_FAIL:-0} + ${ASSET_FAIL:-0} + ${INFRA_FAIL:-0} + ${REDIRECT_FAIL:-0} + ${CONTENT_FAIL:-0} + ${DATA_FAIL:-0} ))
            if [ "$TOTAL_FAIL" -eq 0 ]; then
              echo "## ✅ All checks passed!"
            else
              echo "## ❌ ${TOTAL_FAIL} check(s) failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Final verdict ────────────────────────────────────────────────

      - name: Fail if any checks failed
        id: verdict
        if: always()
        run: |
          TOTAL_FAIL=$(( ${ROUTE_FAIL:-0} + ${ASSET_FAIL:-0} + ${INFRA_FAIL:-0} + ${REDIRECT_FAIL:-0} + ${CONTENT_FAIL:-0} + ${DATA_FAIL:-0} ))
          if [ "$TOTAL_FAIL" -gt 0 ]; then
            echo "::error::🚨 PRODUCTION SITE ISSUE: ${TOTAL_FAIL} smoke test check(s) failed after deploy"
            [ "${ROUTE_FAIL:-0}" -gt 0 ] && echo "::error::  📄 Page routes: ${ROUTE_FAIL} failed out of ${ROUTE_TOTAL:-?}"
            [ "${ASSET_FAIL:-0}" -gt 0 ] && echo "::error::  🖼️ Static assets: ${ASSET_FAIL} failed out of ${ASSET_TOTAL:-?}"
            [ "${INFRA_FAIL:-0}" -gt 0 ] && echo "::error::  🔧 Infrastructure: ${INFRA_FAIL} check(s) failed"
            [ "${REDIRECT_FAIL:-0}" -gt 0 ] && echo "::error::  🔀 Redirects: ${REDIRECT_FAIL} failed"
            [ "${CONTENT_FAIL:-0}" -gt 0 ] && echo "::error::  📝 Content: ${CONTENT_FAIL} spot-check(s) failed"
            [ "${DATA_FAIL:-0}" -gt 0 ] && echo "::error::  📊 Data: ${DATA_FAIL} pipeline data check(s) failed"
            echo "::error::See the job summary for full details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi
          echo "✅ All smoke tests passed"

      # ── Create incident issue on failure ──────────────────────────────

      - name: Create production incident issue
        if: always() && steps.verdict.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const routeFail = parseInt(process.env.ROUTE_FAIL || '0');
            const assetFail = parseInt(process.env.ASSET_FAIL || '0');
            const infraFail = parseInt(process.env.INFRA_FAIL || '0');
            const redirectFail = parseInt(process.env.REDIRECT_FAIL || '0');
            const contentFail = parseInt(process.env.CONTENT_FAIL || '0');
            const dataFail = parseInt(process.env.DATA_FAIL || '0');
            const totalFail = routeFail + assetFail + infraFail + redirectFail + contentFail + dataFail;
            const siteUrl = process.env.SITE_URL;

            // Safety guard: do not create an incident issue if no checks actually failed
            if (totalFail === 0) {
              core.info('totalFail is 0 - skipping incident issue creation.');
              return;
            }

            // Use the deployed commit SHA on workflow_run (matches commit status steps)
            const fullSha = context.eventName === 'workflow_run'
              ? '${{ github.event.workflow_run.head_sha }}'
              : context.sha;
            const shortSha = (fullSha || context.sha).substring(0, 7);

            // Build failure breakdown
            const lines = [];
            if (routeFail > 0) lines.push(`- **Page routes:** ${routeFail} failed (out of ${process.env.ROUTE_TOTAL || '?'})`);
            if (assetFail > 0) lines.push(`- **Static assets:** ${assetFail} failed (out of ${process.env.ASSET_TOTAL || '?'})`);
            if (infraFail > 0) lines.push(`- **Infrastructure:** ${infraFail} check(s) failed`);
            if (redirectFail > 0) lines.push(`- **Redirects:** ${redirectFail} failed`);
            if (contentFail > 0) lines.push(`- **Content spot-checks:** ${contentFail} failed`);
            if (dataFail > 0) lines.push(`- **Pipeline data:** ${dataFail} page(s) missing expected data`);
            const breakdown = lines.length > 0 ? lines.join('\n') : '- See workflow run for details';

            const title = `🚨 Production smoke test failed: ${totalFail} check(s) after deploy (${shortSha})`;
            const body = [
              `## 🚨 Production Site Issue Detected`,
              ``,
              `The post-deploy smoke test **failed** after deploying commit \`${fullSha}\` to ${siteUrl}.`,
              ``,
              `### Failure Summary`,
              ``,
              breakdown,
              ``,
              `### Links`,
              ``,
              `- **Workflow run:** ${runUrl}`,
              `- **Deployed commit:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${fullSha}`,
              `- **Site:** ${siteUrl}`,
              ``,
              `### Priority`,
              ``,
              `This means the **live production site** may have broken pages or assets. Investigate immediately.`,
              ``,
              `---`,
              `*Auto-created by Post-Deploy Smoke Test workflow*`,
            ].join('\n');

            // Ensure required labels exist
            for (const label of [
              { name: 'production-incident', color: 'B60205', description: 'Live production site issue detected by smoke tests' },
              { name: 'bug', color: 'd73a4a', description: 'Something isn\'t working' },
            ]) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-incident', 'bug'],
            });

            core.warning(`Created production incident issue #${issue.number}: ${issue.html_url}`);

      # ── Set commit status on failure ──────────────────────────────────

      - name: Set commit status (failure)
        if: always() && (steps.verdict.outcome == 'failure' || failure())
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.eventName === 'workflow_run'
              ? '${{ github.event.workflow_run.head_sha }}'
              : context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const verdictOutcome = '${{ steps.verdict.outcome }}';
            const description = verdictOutcome === 'failure'
              ? 'FAIL: Production smoke test failed -- site may be broken'
              : 'FAIL: Smoke test workflow failed before checks ran';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha || context.sha,
              state: 'failure',
              target_url: runUrl,
              description,
              context: 'post-deploy-smoke-test',
            });

      - name: Set commit status (success)
        if: always() && steps.verdict.outcome == 'success' && !failure()
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.eventName === 'workflow_run'
              ? '${{ github.event.workflow_run.head_sha }}'
              : context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha || context.sha,
              state: 'success',
              target_url: runUrl,
              description: 'All production smoke tests passed',
              context: 'post-deploy-smoke-test',
            });
