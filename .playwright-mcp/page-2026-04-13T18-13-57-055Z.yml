                                - paragraph [ref=e573]: 'The Fornell-Larcker criterion fails for the Readiness-Maturity pair, while HTMT (.804) passes the .85 threshold. This reflects their shared “organizational capability” dimension: Readiness originates from the TRI/adoption literature and Maturity from CMMI/IT governance. Both scales provide distinct value to their respective practitioner communities despite measuring overlapping variance, and the HTMT result suggests the constructs remain distinguishable under that criterion.'
