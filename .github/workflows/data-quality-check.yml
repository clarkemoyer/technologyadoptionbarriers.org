name: Data Quality Check

# Continuous PII monitoring for committed src/data/ JSON files.
#
# Runs:
#   - On every PR / push that touches src/data/ or the check script itself
#   - Daily on a schedule (catches any drift introduced outside PR reviews)
#   - On manual trigger
#
# What it checks:
#   1. PID scan    - src/data/*.json must not contain 24-char hex Prolific PIDs
#   2. Summary guard - generate_summary.py output must be aggregate-only

on:
  pull_request:
    branches: ['main']
    paths:
      - 'src/data/**'
      # platform-stats.json is auto-generated cloc/git counter output; it
      # is structurally incapable of containing PIDs and is refreshed via
      # auto-PR. Excluding it stops the scan job from racing `gh pr merge
      # --auto` on those refresh PRs and producing phantom failures.
      - '!src/data/platform-stats.json'
      - 'scripts/check-data-pii.py'
      - 'scripts/analysis/tests/generate_summary.py'
      - '.github/workflows/data-quality-check.yml'

  push:
    branches: ['main']
    paths:
      - 'src/data/**'
      - '!src/data/platform-stats.json'
      - 'scripts/check-data-pii.py'
      - 'scripts/analysis/tests/generate_summary.py'
      - '.github/workflows/data-quality-check.yml'

  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC (before analysis pipeline at 09:00)

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pii-scan:
    name: PII Scan (src/data/*.json)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan src/data/**/*.json for PID patterns
        id: pii_scan
        run: |
          python3 scripts/check-data-pii.py 2>&1 | tee /tmp/pii-scan-output.txt
          exit ${PIPESTATUS[0]}

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### PII Scan Results"
            echo ""
            echo '```'
            cat /tmp/pii-scan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  summary-guard:
    name: Step-Summary Aggregate-Only Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify generate_summary produces aggregate-only output
        run: |
          # Run generate_summary.py against the committed JSON files.
          # The script's _assert_no_pids() guard will abort with exit 1
          # if any 24-char hex string appears in its output.
          FAILED=0
          for f in src/data/sensitivity-analysis.json src/data/data-audit.json; do
            if [ -f "$f" ]; then
              python3 scripts/analysis/tests/generate_summary.py "$f" 2>&1 || FAILED=1
            else
              echo "ℹ️  $f not present - skipping (generated by pipeline runs)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Step summary guard failed."
            exit 1
          fi
          echo "✅ Step summary output contains aggregate counts only."
