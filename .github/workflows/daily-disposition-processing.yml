name: Daily Disposition Processing (REPLACED)

# ⚠️  SUPERSEDED by daily-pipeline.yml which chains analysis + operations
# into a single workflow with no inter-phase delay. This file is kept for
# reference and manual dispatch only. The schedule trigger has been removed.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Superseded by daily-pipeline.yml. Use that instead.'
        required: false

concurrency:
  group: daily-disposition-processing
  cancel-in-progress: false # Let the current run finish; queue the next one

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Step 1: Get disposition CSV - prefer analysis pipeline artifact, fallback to fresh export
  triage:
    name: Get Disposition Data
    runs-on: ubuntu-latest
    environment: qualtrics-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Try to download the disposition CSV from today's analysis pipeline run.
      # Uses the same artifact name the analysis pipeline uploads.
      - name: Download disposition CSV from analysis pipeline
        id: download-artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: disposition-csv
          path: ${{ runner.temp }}

      # Fallback: if the artifact isn't available, do a fresh export + triage
      - name: Fallback - Export Qualtrics responses
        if: steps.download-artifact.outcome == 'failure'
        run: |
          echo "::warning::Analysis pipeline artifact not available - falling back to fresh Qualtrics export"
          python3 scripts/analysis/export_qualtrics.py
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_BASE_URL: ${{ vars.QUALTRICS_BASE_URL }}
          QUALTRICS_SURVEY_ID: ${{ vars.QUALTRICS_SURVEY_ID }}
          OUTPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv

      - name: Fallback - Run disposition triage
        if: steps.download-artifact.outcome == 'failure'
        run: |
          set -euo pipefail
          python3 scripts/analysis/disposition_triage.py 2>&1 | tee ${{ runner.temp }}/triage-output.txt
        env:
          INPUT_PATH: ${{ runner.temp }}/qualtrics-export.csv
          OUTPUT_PATH: ${{ runner.temp }}/disposition.csv

      - name: Report data source
        run: |
          if [ -f "${{ runner.temp }}/disposition.csv" ]; then
            ROWS=$(wc -l < "${{ runner.temp }}/disposition.csv")
            echo "Disposition CSV has $ROWS lines (including header)"
            echo "Source: ${{ steps.download-artifact.outcome == 'success' && 'analysis pipeline artifact' || 'fresh Qualtrics export (fallback)' }}"
          else
            echo "::error::No disposition CSV available"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: disposition-csv-ops
          path: ${{ runner.temp }}/disposition.csv
          retention-days: 1

  # Step 2: Auto-approve CLEAN
  approve-clean:
    name: Auto-Approve CLEAN
    needs: triage
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv-ops
          path: ${{ runner.temp }}

      - name: Approve CLEAN submissions
        run: |
          set -euo pipefail
          python3 scripts/analysis/approve_submissions.py 2>&1 | tee ${{ runner.temp }}/approve-output.txt
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          DRY_RUN: 'false'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approve-metrics
          path: ${{ runner.temp }}/approve-output.txt
          retention-days: 1

  # Step 3: Message un-messaged FLAG participants
  message-flags:
    name: Message New FLAG Participants
    needs: triage
    runs-on: ubuntu-latest
    environment: prolific-prod
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        disposition:
          - FLAG-SINGLE-IRI
          - FLAG-SMEAL
          - FLAG-PARTIAL-STRAIGHTLINING
          - FLAG-SPEED
          - AUTO-EXCLUDE:IRI3_SPEED_RETURN
          - AUTO-EXCLUDE:IRI3_RETURN
          - AUTO-EXCLUDE:IRI2_SPEED_RETURN
          - AUTO-EXCLUDE:IRI2_RETURN
          - AUTO-EXCLUDE:SPEED_IRI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv-ops
          path: ${{ runner.temp }}

      - name: Send messages for ${{ matrix.disposition }}
        run: |
          set -euo pipefail
          python3 scripts/analysis/message_flagged.py 2>&1 | tee ${{ runner.temp }}/message-output.txt
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          DISPOSITION_FILTER: ${{ matrix.disposition }}
          DRY_RUN: 'false'

      # Note: message-output.txt contains PIDs for operational debugging.
      # Artifact has 1-day retention; same data appears in workflow logs.
      - name: Sanitize artifact name
        if: always()
        run: echo "ARTIFACT_NAME=message-metrics-${DISPOSITION_FILTER//:/-}" >> "$GITHUB_ENV"
        env:
          DISPOSITION_FILTER: ${{ matrix.disposition }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/message-output.txt
          retention-days: 1

  # Step 4a: Generate dashboard data (needs Prolific API)
  generate-dashboard:
    name: Generate Dashboard Data
    needs: [triage, approve-clean]
    if: ${{ needs.triage.result == 'success' && needs.approve-clean.result == 'success' }}
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: disposition-csv-ops
          path: ${{ runner.temp }}

      - name: Generate disposition summary
        run: python3 scripts/analysis/generate_disposition_summary.py
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ vars.PROLIFIC_STUDY_ID }}
          CSV_FILE_PATH: ${{ runner.temp }}/disposition.csv
          OUTPUT_PATH: ${{ runner.temp }}/disposition-summary.json

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-data
          path: ${{ runner.temp }}/disposition-summary.json
          retention-days: 1

  # Step 4b: Create PR with updated dashboard data (needs copilot token)
  update-dashboard-pr:
    name: Update Dashboard PR
    needs: generate-dashboard
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-data
          path: src/data

      - uses: ./.github/actions/format-and-pr
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
          files: 'src/data/disposition-summary.json'
          commit-message: 'chore: update disposition dashboard data'
          pr-title: 'Update disposition dashboard data'
          pr-body: 'Automated update of disposition-summary.json from live Prolific API + Qualtrics triage.'
          branch: chore/disposition-dashboard-update

  # Step 5: Create daily report issue with full details and deltas
  daily-report:
    name: Create Daily Report Issue
    needs: [triage, approve-clean, message-flags, generate-dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch latest main so PREV_FILE has the most recent committed data
          ref: main

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
        continue-on-error: true

      - name: Build and create daily report issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          PREV_FILE: src/data/disposition-summary.json
          TRIAGE_RESULT: ${{ needs.triage.result }}
          APPROVE_RESULT_STATUS: ${{ needs.approve-clean.result }}
          MESSAGE_RESULT: ${{ needs.message-flags.result }}
          DASHBOARD_RESULT: ${{ needs.generate-dashboard.result }}
        run: bash scripts/build-daily-report.sh
