name: Check Participant Details

on:
  workflow_dispatch:
    inputs:
      pid:
        description: 'Prolific Participant ID'
        required: true
        type: string
      study_id:
        description: 'Study ID (defaults to PROLIFIC_STUDY_ID)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check Participant
    runs-on: ubuntu-latest
    environment: prolific-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Fetch submission details
        env:
          PROLIFIC_API_TOKEN: ${{ secrets.TABS_PROLIFIC_TOKEN }}
          STUDY_ID: ${{ inputs.study_id || vars.PROLIFIC_STUDY_ID }}
          PID: ${{ inputs.pid }}
        run: |
          npx --no-install tsx -e "
          import { listStudySubmissions, listStudyMessages } from './src/lib/prolific-api';
          async function main() {
            const token = process.env.PROLIFIC_API_TOKEN!;
            const studyId = process.env.STUDY_ID!;
            const pid = process.env.PID!;

            console.log('=== SUBMISSION STATUS ===');
            const subs = await listStudySubmissions(studyId, token);
            const sub = (subs.results || []).find((s: any) => s.participant_id === pid);
            if (sub) {
              console.log('Status:', sub.status);
              console.log('Started:', sub.started_at);
              console.log('Completed:', sub.completed_at);
              console.log('Time taken:', sub.time_taken, 'seconds');
            } else {
              console.log('No submission found for this PID');
            }

            console.log('');
            console.log('=== MESSAGES ===');
            try {
              // Try multiple Prolific messaging endpoints
              const endpoints = [
                '/messages/?participant=' + pid,
                '/messages/?participant_id=' + pid,
                '/studies/' + studyId + '/messages/',
              ];
              let found = false;
              for (const ep of endpoints) {
                try {
                  const resp = await fetch('https://api.prolific.com/api/v1' + ep, {
                    headers: { 'Authorization': 'Token ' + token }
                  });
                  if (resp.ok) {
                    const data = await resp.json() as any;
                    const results = data.results || data || [];
                    const msgs = Array.isArray(results) ? results : [];
                    const filtered = msgs.filter((m: any) =>
                      m.participant_id === pid || m.participant === pid
                    );
                    if (filtered.length > 0 || msgs.length > 0) {
                      console.log('Endpoint:', ep);
                      console.log('Total messages:', msgs.length);
                      console.log('For this PID:', filtered.length);
                      for (const m of (filtered.length > 0 ? filtered : msgs.slice(0, 5))) {
                        console.log('');
                        console.log('---');
                        console.log(JSON.stringify(m, null, 2));
                      }
                      found = true;
                      break;
                    }
                  } else {
                    console.log('Endpoint', ep, ':', resp.status);
                  }
                } catch (e) {
                  console.log('Endpoint', ep, ': failed');
                }
              }
              if (!found) {
                console.log('Could not retrieve messages. Check Prolific UI for message history.');
              }
            } catch (e) {
              console.log('Message retrieval failed:', e);
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "
