name: Auto-Approve Bot Workflows

# Poll every 15 minutes for action_required workflows from the Copilot bot
# and re-run them under the repo owner's context.
#
# This avoids the infinite loop where workflow_run triggers also need approval.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write


env:
  # Official GitHub flag to force Node.js 24 runtime ahead of the June 2026 mandatory deadline.
  # Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unblock-bot-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run action_required workflows from Copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for action_required workflows from Copilot..."
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?status=action_required&per_page=100" \
            --jq '.workflow_runs[] | select(.actor.login == "Copilot") | .id')

          COUNT=$(echo "$RUNS" | grep -c '[0-9]' || echo 0)

          if [ "$COUNT" -eq 0 ]; then
            echo "No blocked runs found. All clear."
            exit 0
          fi

          echo "Found $COUNT blocked runs. Re-running..."
          for RUN_ID in $RUNS; do
            gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun" -X POST 2>/dev/null \
              && echo "  Re-ran: $RUN_ID" \
              || echo "  Failed: $RUN_ID"
          done
          echo "Done."
